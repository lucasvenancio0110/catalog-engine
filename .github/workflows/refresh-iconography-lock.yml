name: Refresh iconography dependency lock

on:
  push:
    branches:
      - ux/iconography-deps-v1
    paths:
      - package.json
      - .github/workflows/refresh-iconography-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ux/iconography-deps-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install contract
        run: npm ci --ignore-scripts

      - name: Commit refreshed lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "catalog-engine-ci"
          git config user.email "catalog-engine-ci@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package lock for iconography dependencies"
          git push origin HEAD:ux/iconography-deps-v1
