name: Configure Cloudflare platform hosts

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-platform-hosts.yml"
      - "scripts/configure-cloudflare-platform-hosts.mjs"
      - "tests/cloudflare-platform-hosts.test.mjs"
      - "docs/CUSTOM-DOMAINS.md"
      - "docs/TENANT-PUBLISH.md"
      - "docs/TENANT-RUNTIME-DISPATCH.md"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-platform-hosts.yml"
      - "scripts/configure-cloudflare-platform-hosts.mjs"
      - "tests/cloudflare-platform-hosts.test.mjs"
      - "docs/CUSTOM-DOMAINS.md"
      - "docs/TENANT-PUBLISH.md"
      - "docs/TENANT-RUNTIME-DISPATCH.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-engine-platform-hosts
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate platform-host automation
        run: |
          node --check scripts/configure-cloudflare-platform-hosts.mjs
          npx vitest run tests/cloudflare-platform-hosts.test.mjs

  apply:
    # One-time verification for the manually-created app DNS record.
    # This branch-specific allowance is not intended to merge to main.
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/app-host-live-activation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_HOST: app.catalogoengine.com
    steps:
      - name: Verify public DNS, HTTPS, portal and health
        shell: bash
        run: |
          set -u
          ROOT_URL="https://${APP_HOST}/"
          HEALTH_URL="https://${APP_HOST}/api/health"

          for attempt in $(seq 1 12); do
            echo "Public app verification attempt ${attempt}/12"

            root_status="$(curl --silent --show-error --max-time 15 --output /tmp/app-root.html --write-out '%{http_code}' "$ROOT_URL" || true)"
            health_status="$(curl --silent --show-error --max-time 15 --output /tmp/app-health.json --write-out '%{http_code}' "$HEALTH_URL" || true)"

            echo "root=${root_status:-curl_failed} health=${health_status:-curl_failed}"

            if test "$root_status" = "200" \
              && test "$health_status" = "200" \
              && grep -q "Catalog Engine" /tmp/app-root.html \
              && grep -q '"ok":true' /tmp/app-health.json \
              && grep -q '"service":"catalog-engine"' /tmp/app-health.json; then
              echo "app.catalogoengine.com is live and serving the customer portal."
              echo "Health response:"
              cat /tmp/app-health.json
              exit 0
            fi

            if test -s /tmp/app-root.html; then
              echo "Root body (first 240 bytes):"
              head -c 240 /tmp/app-root.html
              echo
            fi
            if test -s /tmp/app-health.json; then
              echo "Health body (first 240 bytes):"
              head -c 240 /tmp/app-health.json
              echo
            fi

            if test "$attempt" -lt 12; then
              sleep 5
            fi
          done

          echo "app.catalogoengine.com did not become healthy within the verification window." >&2
          exit 1
