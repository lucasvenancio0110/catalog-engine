name: Validate tenant ingestion

on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/0012_tenant_import_jobs.sql'
      - 'migrations/0013_tenant_import_scan_resume.sql'
      - 'migrations/0014_tenant_classify_verify_jobs.sql'
      - 'src/catalog-provider/**'
      - 'src/domain/catalog-classifier.js'
      - 'worker/ingestion/**'
      - 'worker/import-*-entry.js'
      - 'worker/tenant-import-*.js'
      - 'worker/tenant-classification-runner.js'
      - 'worker/tenant-verification-runner.js'
      - 'worker/tenant-data-plane-schema*.js'
      - 'worker/data-plane-migration-runner.js'
      - 'worker/cloudflare-platform.js'
      - 'scripts/emit-tenant-data-plane-schema.mjs'
      - 'tests/tenant-import-*.test.mjs'
      - 'tests/catalog-provider-contract.test.mjs'
      - 'tests/catalog-classifier.test.mjs'
      - 'tests/tenant-data-plane-schema.test.mjs'
      - 'docs/PROVIDER-ENGINE.md'
      - 'docs/TENANT-IMPORT-*.md'
      - 'wrangler.import-*.jsonc'
      - 'wrangler.jsonc'
      - '.github/workflows/validate-tenant-ingestion.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_VERSION: 4.123.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run quality

      - name: Validate staged scan/detail Worker configs
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --config wrangler.import-scan.jsonc --outdir /tmp/catalog-engine-import-scan
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --config wrangler.import-detail.jsonc --outdir /tmp/catalog-engine-import-detail

      - name: Apply control-plane migrations including post-import jobs
        shell: bash
        run: |
          set -euo pipefail
          DB=/tmp/catalog-engine-ingestion-ci.sqlite
          rm -f "$DB"
          for migration in migrations/*.sql; do
            sqlite3 "$DB" < "$migration"
          done
          sqlite3 "$DB" 'PRAGMA foreign_key_check;'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM pragma_table_info('tenant_import_jobs') WHERE name IN ('detail_enqueue_cursor','scan_completed_at','scan_lease_until');")" = '3'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='tenant_classification_jobs';")" = '1'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='tenant_verification_jobs';")" = '1'

      - name: Verify tenant data-plane v3 classification tables
        shell: bash
        run: |
          set -euo pipefail
          TENANT_DB=/tmp/catalog-engine-tenant-ingestion-ci.sqlite
          SQL=/tmp/catalog-engine-tenant-ingestion.sql
          rm -f "$TENANT_DB" "$SQL"
          TENANT_DATA_PLANE_SQL_OUT="$SQL" \
          TENANT_ID='t_0123456789abcdefabcd' \
          SOURCE_URL='https://supplier-test.x.yupoo.com/albums/' \
          node scripts/emit-tenant-data-plane-schema.mjs
          sqlite3 "$TENANT_DB" < "$SQL"
          test "$(sqlite3 "$TENANT_DB" "SELECT schema_version FROM data_plane_identity LIMIT 1;")" = '3'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM data_plane_schema_migrations WHERE version IN (1,2,3);")" = '3'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='supplier_category_index';")" = '1'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='supplier_album_detail_state';")" = '1'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='catalog_product_classification_state';")" = '1'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='catalog_product_classification_overrides';")" = '1'
          sqlite3 "$TENANT_DB" 'PRAGMA foreign_key_check;'
