name: Validate tenant ingestion

on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/0012_tenant_import_jobs.sql'
      - 'migrations/0013_tenant_import_scan_resume.sql'
      - 'migrations/0014_tenant_classify_verify_jobs.sql'
      - 'migrations/0017_tenant_sync_schedules.sql'
      - 'migrations/0018_tenant_data_plane_fleet_migrations.sql'
      - 'migrations/0019_tenant_data_plane_migration_capability.sql'
      - 'migrations/0020_tenant_sync_controlled_enrollment.sql'
      - 'migrations/0021_tenant_sync_finalization.sql'
      - 'migrations/0022_tenant_sync_recovery.sql'
      - 'src/catalog-provider/**'
      - 'src/domain/catalog-classifier.js'
      - 'src/sync/**'
      - 'worker/ingestion/**'
      - 'worker/import-*-entry.js'
      - 'worker/tenant-import-*.js'
      - 'worker/tenant-sync-*.js'
      - 'worker/tenant-data-plane-command.js'
      - 'worker/tenant-classification-runner.js'
      - 'worker/tenant-verification-runner.js'
      - 'worker/tenant-data-plane-schema*.js'
      - 'worker/data-plane-migration-runner.js'
      - 'worker/cloudflare-platform.js'
      - 'scripts/emit-tenant-data-plane-schema.mjs'
      - 'scripts/cloudflare-tenant-data-plane-fleet-prepare.mjs'
      - 'scripts/incremental-sync-core.mjs'
      - 'tests/tenant-import-*.test.mjs'
      - 'tests/tenant-sync-*.test.mjs'
      - 'tests/listing-delta-core.test.mjs'
      - 'tests/incremental-sync.test.mjs'
      - 'tests/tenant-data-plane-command.test.mjs'
      - 'tests/catalog-provider-contract.test.mjs'
      - 'tests/catalog-classifier.test.mjs'
      - 'tests/tenant-data-plane-schema.test.mjs'
      - 'tests/tenant-data-plane-fleet-preparation.test.mjs'
      - 'docs/PROVIDER-ENGINE.md'
      - 'docs/TENANT-IMPORT-*.md'
      - 'docs/TENANT-SYNC.md'
      - 'wrangler.import-*.jsonc'
      - 'wrangler.jsonc'
      - '.github/workflows/validate-tenant-ingestion.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_VERSION: 4.123.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run quality

      - name: Validate staged scan/detail Worker configs
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --config wrangler.import-scan.jsonc --outdir /tmp/catalog-engine-import-scan
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --config wrangler.import-detail.jsonc --outdir /tmp/catalog-engine-import-detail

      - name: Apply control-plane migrations including post-import jobs
        shell: bash
        run: |
          set -euo pipefail
          DB=/tmp/catalog-engine-ingestion-ci.sqlite
          rm -f "$DB"
          for migration in migrations/*.sql; do
            sqlite3 "$DB" < "$migration"
          done
          sqlite3 "$DB" 'PRAGMA foreign_key_check;'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM pragma_table_info('tenant_import_jobs') WHERE name IN ('detail_enqueue_cursor','scan_completed_at','scan_lease_until');")" = '3'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM pragma_table_info('tenant_import_jobs') WHERE name IN ('state_revision','recovery_attempt_count','last_failure_phase','phase_lease_kind','phase_lease_token','phase_lease_until','last_recovery_at','last_delivery_at','candidate_classified_at');")" = '9'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='tenant_classification_jobs';")" = '1'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='tenant_verification_jobs';")" = '1'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='tenant_sync_schedules';")" = '1'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='tenant_sync_enrollments';")" = '1'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='tenant_sync_replay_requests';")" = '1'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM tenant_sync_enrollments WHERE status='enrolled';")" = '0'

      - name: Verify current tenant data-plane schema
        shell: bash
        run: |
          set -euo pipefail
          TENANT_DB=/tmp/catalog-engine-tenant-ingestion-ci.sqlite
          SQL=/tmp/catalog-engine-tenant-ingestion.sql
          rm -f "$TENANT_DB" "$SQL"
          TENANT_DATA_PLANE_SQL_OUT="$SQL" \
          TENANT_ID='t_0123456789abcdefabcd' \
          SOURCE_URL='https://supplier-test.x.yupoo.com/albums/' \
          node scripts/emit-tenant-data-plane-schema.mjs
          sqlite3 "$TENANT_DB" < "$SQL"
          test "$(sqlite3 "$TENANT_DB" "SELECT schema_version FROM data_plane_identity LIMIT 1;")" = '8'
          test "$(sqlite3 "$TENANT_DB" "SELECT GROUP_CONCAT(version, ',') FROM (SELECT version FROM data_plane_schema_migrations ORDER BY version);")" = '1,2,3,4,5,6,7,8'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='supplier_category_index';")" = '1'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='supplier_album_detail_state';")" = '1'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='catalog_product_classification_state';")" = '1'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='catalog_product_classification_overrides';")" = '1'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='catalog_product_intelligence_state';")" = '1'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('supplier_sync_stage_runs','supplier_sync_stage_observations','supplier_sync_stage_events','supplier_sync_stage_categories');")" = '4'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('supplier_sync_stage_catalog_categories','supplier_sync_stage_leagues','supplier_sync_stage_teams','supplier_sync_stage_facets','supplier_sync_stage_media_sources','supplier_sync_stage_product_details','supplier_sync_stage_product_media','supplier_sync_stage_product_categories','supplier_sync_stage_product_facets','supplier_sync_stage_classification_state','supplier_sync_stage_intelligence_state','supplier_sync_stage_catalog_meta');")" = '12'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('catalog_serving_authority','supplier_sync_stage_authority');")" = '2'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('supplier_scope_memberships','supplier_sync_stage_removal_policy','catalog_product_classification_override_retention');")" = '3'
          test "$(sqlite3 "$TENANT_DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='view' AND name='catalog_product_effective_classification_overrides';")" = '1'
          sqlite3 "$TENANT_DB" 'PRAGMA foreign_key_check;'
