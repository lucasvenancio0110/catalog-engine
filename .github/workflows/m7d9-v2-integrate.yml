name: M7D9 v2 integration gate

on:
  push:
    branches: ['m7d9/repeated-miss-safe-removal-v2']
    paths:
      - '.github/workflows/m7d9-v2-integrate.yml'
      - 'scripts/m7d9-v2-integrate.mjs'

permissions:
  contents: write

concurrency:
  group: catalog-engine-m7d9-v2-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: m7d9/repeated-miss-safe-removal-v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply clean M7D9 v2 integration
        run: node scripts/m7d9-v2-integrate.mjs
      - name: Diff sanity
        run: git diff --check
      - name: Legacy incremental regression gate
        run: >-
          npx vitest run
          tests/tenant-data-plane-schema-v7.test.mjs
          tests/tenant-incremental-stage.test.mjs
          tests/tenant-incremental-stage-ledger.test.mjs
          tests/tenant-incremental-stage-d1-affinity.test.mjs
          tests/tenant-incremental-scan-consumer.test.mjs
          tests/tenant-incremental-scan-safety.test.mjs
          tests/tenant-incremental-dispatch-routing.test.mjs
          tests/tenant-incremental-classification.test.mjs
          tests/tenant-incremental-verification.test.mjs
          tests/tenant-incremental-promotion.test.mjs
          tests/tenant-incremental-finalization.test.mjs
      - name: Dependency policy
        run: npm run deps:check
      - name: ESLint
        run: npm run lint
      - name: Commit integrated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "catalog-engine-m7d9-bot"
          git config user.email "catalog-engine-m7d9-bot@users.noreply.github.com"
          git add worker/tenant-data-plane-command.js worker/data-plane-migration-runner.js worker/ingestion/incremental-stage.js worker/ingestion/incremental-classification-runner.js
          git diff --cached --quiet && { echo 'No integration changes'; exit 1; }
          git commit -m "m7d9: integrate additive v8 removal foundations"
          git push origin HEAD:m7d9/repeated-miss-safe-removal-v2
