name: Tenant import automation preflight

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/tenant-import-auto-preflight.yml"
      - "scripts/tenant-import-auto-preflight.mjs"
      - "tests/tenant-import-auto-preflight.test.mjs"
      - "worker/tenant-import-dispatcher.js"
      - "wrangler.jsonc"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/tenant-import-auto-preflight.yml"
      - "scripts/tenant-import-auto-preflight.mjs"
      - "tests/tenant-import-auto-preflight.test.mjs"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret-free quality gate
        run: npm run quality

  preflight:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      STATUS_CONTEXT: catalog-engine/tenant-import-auto-preflight

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate trusted Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install dependencies
        run: npm ci
      - name: Quality gate
        run: npm run quality
      - name: Run read-only production preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tenant-import-auto-preflight.mjs | tee /tmp/tenant-import-preflight.json
          cat /tmp/tenant-import-preflight.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish successful preflight evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          DESCRIPTION="Control plane + 4 Queue backlogs clean; safe to consider initial-import activation"
          if jq -e '.automationEnabled == true' /tmp/tenant-import-preflight.json >/dev/null; then
            DESCRIPTION="Initial import enabled; DLQs + disposable-canary hygiene clean"
          fi
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description "$DESCRIPTION" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json

      - name: Publish failed preflight evidence
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state failure --arg context "$STATUS_CONTEXT" \
            --arg description "Tenant import preflight not clean; no automation state changed" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
