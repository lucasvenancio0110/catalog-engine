name: M7D9 integration gate

on:
  push:
    branches: ['m7d9/repeated-miss-safe-removal-v1']
    paths:
      - '.github/workflows/m7d9-integrate.yml'
      - 'scripts/m7d9-integrate.mjs'
      - 'scripts/m7d9-correct.mjs'

permissions:
  contents: write

concurrency:
  group: catalog-engine-m7d9-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: m7d9/repeated-miss-safe-removal-v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply M7D9 integration
        run: |
          node scripts/m7d9-integrate.mjs
          node scripts/m7d9-correct.mjs
      - name: Diff sanity
        run: git diff --check
      - name: Dependency policy
        run: npm run deps:check
      - name: Tests
        run: npm run test -- --reporter=json --outputFile=/tmp/m7d9-vitest.json
      - name: Persist compact failing test summary
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/m7d9-vitest.json || exit 0
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('/tmp/m7d9-vitest.json', 'utf8'));
          const failed = [];
          for (const suite of report.testResults || []) {
            const assertions = (suite.assertionResults || [])
              .filter((entry) => entry.status === 'failed')
              .map((entry) => ({
                name: entry.fullName,
                failures: entry.failureMessages
              }));
            if (assertions.length) failed.push({ file: suite.name, assertions });
          }
          await writeFile(
            'm7d9-vitest-summary.json',
            JSON.stringify({
              totalSuites: report.numTotalTestSuites,
              failedSuites: report.numFailedTestSuites,
              totalTests: report.numTotalTests,
              failedTests: report.numFailedTests,
              failed
            }, null, 2) + '\n'
          );
          NODE
          git config user.name "catalog-engine-m7d9-bot"
          git config user.email "catalog-engine-m7d9-bot@users.noreply.github.com"
          git add m7d9-vitest-summary.json
          git diff --cached --quiet && exit 0
          git commit -m "ci: capture compact M7D9 test diagnostics"
          git push origin HEAD:m7d9/repeated-miss-safe-removal-v1
      - name: ESLint
        if: success()
        run: npm run lint
      - name: Commit integration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "catalog-engine-m7d9-bot"
          git config user.email "catalog-engine-m7d9-bot@users.noreply.github.com"
          git add worker scripts/emit-tenant-data-plane-schema.mjs scripts/cloudflare-tenant-data-plane-fleet-prepare.mjs
          git diff --cached --quiet && { echo "No integration changes"; exit 1; }
          git commit -m "m7d9: integrate scoped removal into promotion authority"
          git push origin HEAD:m7d9/repeated-miss-safe-removal-v1
