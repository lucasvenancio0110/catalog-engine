name: Bootstrap Cloudflare D1

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-d1-bootstrap.yml"
      - "migrations/**"

permissions:
  contents: write

concurrency:
  group: cloudflare-d1-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: catalog-engine-db
      WRANGLER_VERSION: 4.123.0

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Discover D1 database ID
        shell: bash
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" d1 list --json > /tmp/d1-list.json
          node <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/d1-list.json', 'utf8'));
          const databases = Array.isArray(raw) ? raw : raw.result || raw.databases || [];
          const wanted = process.env.D1_DATABASE_NAME;
          const database = databases.find((entry) => entry && entry.name === wanted);
          if (!database) {
            console.error(`D1 database not found: ${wanted}`);
            process.exit(1);
          }
          const id = database.uuid || database.id || database.database_id;
          if (!id) {
            console.error(`D1 database ${wanted} did not return an ID.`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `D1_DATABASE_ID=${id}\n`);
          console.log(`Found D1 database ${wanted}.`);
          NODE

      - name: Materialize D1 binding in Wrangler config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.d1_databases = [
            {
              binding: 'CATALOG_DB',
              database_name: process.env.D1_DATABASE_NAME,
              database_id: process.env.D1_DATABASE_ID,
              migrations_dir: 'migrations'
            }
          ];
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`, 'utf8');
          NODE

      - name: Install project dependencies
        run: npm ci

      - name: Quality gate
        run: npm run quality

      - name: Apply D1 migrations to production database
        run: npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply CATALOG_DB --remote --config wrangler.jsonc

      - name: Verify media_sources table
        run: npx --yes "wrangler@$WRANGLER_VERSION" d1 execute CATALOG_DB --remote --config wrangler.jsonc --command="SELECT COUNT(*) AS rows_count FROM media_sources;"

      - name: Build and verify storefront
        run: |
          npm run build
          npm run build:verify

      - name: Deploy Worker with D1 binding
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.jsonc

      - name: Persist resolved D1 binding in repository
        shell: bash
        run: |
          git config user.name "catalog-engine-bot"
          git config user.email "catalog-engine-bot@users.noreply.github.com"
          git add wrangler.jsonc
          if git diff --cached --quiet; then
            echo "Wrangler D1 binding is already current."
          else
            git commit -m "chore: persist Cloudflare D1 binding"
            git push origin HEAD:main
          fi
