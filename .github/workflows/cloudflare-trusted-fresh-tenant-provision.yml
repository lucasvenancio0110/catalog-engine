name: Cloudflare trusted fresh tenant provisioning

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-trusted-fresh-tenant-provision.yml'
      - 'scripts/cloudflare-trusted-fresh-tenant-provision.mjs'
      - 'scripts/cloudflare-trusted-tenant-runtime-stage.mjs'
      - 'tests/trusted-fresh-tenant-provision.test.mjs'
      - 'tests/trusted-tenant-runtime-stage.test.mjs'
      - 'tests/tenant-runtime-runner.test.mjs'
      - 'worker/cloudflare-platform.js'
      - 'worker/tenant-runtime-runner.js'
      - 'worker/tenant-catalog-runtime.js'
      - 'worker/tenant-data-plane-schema-v8.js'
      - 'scripts/d1-batch-chunks.mjs'
      - 'wrangler.jsonc'
  # Production application deploy owns the immediate post-merge mutation slot.
  # Scheduled provisioning resolves and waits for that exact deployed SHA outside
  # the shared mutation lock, then acquires the lock only for physical mutations.
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Trusted provisioning and runtime staging tests
        run: npx vitest run tests/trusted-fresh-tenant-provision.test.mjs tests/trusted-tenant-runtime-stage.test.mjs tests/tenant-runtime-runner.test.mjs
      - name: Secret-free quality gate
        run: npm run quality

  prerequisites:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve exact trusted-main SHA
        id: target
        env:
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA" || { echo 'Missing trusted-main SHA'; exit 1; }
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-SHA application deploy outside mutation lock
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            STATUS_JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/commits/$SHA/status")"
            APP_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/application-deploy")][0].state // "missing"')"
            if test "$APP_STATE" = 'success'; then
              echo 'exact_sha_application_deploy=success'
              exit 0
            fi
            if test "$APP_STATE" = 'failure' -o "$APP_STATE" = 'error'; then
              echo "Exact-SHA application deploy state=$APP_STATE"
              exit 1
            fi
            sleep 10
          done
          echo 'Exact-SHA application deploy evidence did not arrive'
          exit 1

  provision:
    needs: prerequisites
    if: needs.prerequisites.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: catalog-engine-production-d1
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      TRUSTED_FRESH_PROVISION_LIMIT: '3'
      TRUSTED_RUNTIME_STAGE_LIMIT: '1'
      STATUS_CONTEXT: catalog-engine/trusted-fresh-provisioning
    steps:
      - name: Checkout exact deployed trusted main
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prerequisites.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify recurring Intelligent Sync remains disabled
        shell: bash
        run: |
          set -euo pipefail
          VALUE="$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(String(c.vars?.TENANT_SYNC_AUTOMATION_ENABLED || ''));" )"
          test "$VALUE" = '0' || { echo 'Recurring Intelligent Sync must remain disabled'; exit 1; }
      - name: Validate trusted Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
      - name: Provision fresh tenant data planes from trusted CI
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-trusted-fresh-tenant-provision.mjs | tee /tmp/trusted-fresh-provision.json
          cat /tmp/trusted-fresh-provision.json >> "$GITHUB_STEP_SUMMARY"
      - name: Stage verified tenant catalog runtimes from trusted CI
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-trusted-tenant-runtime-stage.mjs | tee /tmp/trusted-runtime-stage.json
          cat /tmp/trusted-runtime-stage.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish successful trusted provisioning evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.prerequisites.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description 'Trusted CI tenant provisioning and runtime staging completed; recurring sync remains off' \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
