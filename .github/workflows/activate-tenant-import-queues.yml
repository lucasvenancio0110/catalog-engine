name: Activate tenant import Queue consumers

on:
  workflow_run:
    workflows: ['Deploy Catalog Engine application']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  activate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Only a successful exact-SHA application deploy may enqueue Queue mutations
      # into the shared production slot. Cancelled/failed deploy workflow_run events
      # are rejected before concurrency acquisition so they cannot replace a pending deploy.
      group: catalog-engine-production-d1
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.123.0
      STATUS_CONTEXT: catalog-engine/queue-consumer-activation

    steps:
      - name: Resolve exact deployed trusted-main SHA
        id: target
        env:
          EVENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVENT_SHA" || { echo "Missing target SHA"; exit 1; }
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact deployed trusted-main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Quality gate before production mutation
        run: npm run quality

      - name: Validate tenant import automation setting
        shell: bash
        run: |
          set -euo pipefail
          AUTOMATION_VALUE="$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(String(c.vars?.TENANT_IMPORT_AUTOMATION_ENABLED || ''));" )"
          test "$AUTOMATION_VALUE" = "0" -o "$AUTOMATION_VALUE" = "1" || { echo "Invalid tenant import automation setting"; exit 1; }
          echo "TENANT_IMPORT_AUTOMATION_ENABLED=$AUTOMATION_VALUE"

      - name: Ensure primary and dead-letter Queues exist
        shell: bash
        run: |
          set -euo pipefail
          QUEUES=(
            catalog-engine-import-scan
            catalog-engine-import-detail
            catalog-engine-import-scan-dlq
            catalog-engine-import-detail-dlq
          )
          npx --yes "wrangler@$WRANGLER_VERSION" queues list | tee /tmp/catalog-engine-queues.txt
          for queue in "${QUEUES[@]}"; do
            if grep -Fq "$queue" /tmp/catalog-engine-queues.txt; then
              echo "Queue already exists: $queue"
            else
              echo "Creating Queue: $queue"
              npx --yes "wrangler@$WRANGLER_VERSION" queues create "$queue"
            fi
          done
          npx --yes "wrangler@$WRANGLER_VERSION" queues list | tee /tmp/catalog-engine-queues-final.txt
          for queue in "${QUEUES[@]}"; do
            grep -Fq "$queue" /tmp/catalog-engine-queues-final.txt || { echo "Queue missing after ensure: $queue"; exit 1; }
          done

      - name: Build bounded IC4B detail consumer config
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-ic4b-detail-config.mjs \
            wrangler.import-detail.jsonc \
            /tmp/wrangler.import-detail.ic4b.json

      - name: Deploy IC4B detail consumer first
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --config /tmp/wrangler.import-detail.ic4b.json

      - name: Deploy scan consumer
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.import-scan.jsonc

      - name: Verify Queue consumers and IC4B policies are attached
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" queues info catalog-engine-import-scan
          npx --yes "wrangler@$WRANGLER_VERSION" queues info catalog-engine-import-detail
          npx --yes "wrangler@$WRANGLER_VERSION" queues consumer worker list catalog-engine-import-scan --json | tee /tmp/scan-consumers.json
          npx --yes "wrangler@$WRANGLER_VERSION" queues consumer worker list catalog-engine-import-detail --json | tee /tmp/detail-consumers.json
          grep -Fq 'catalog-engine-import-scan' /tmp/scan-consumers.json || { echo "Scan consumer not attached"; exit 1; }
          grep -Fq 'catalog-engine-import-detail' /tmp/detail-consumers.json || { echo "Detail consumer not attached"; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/detail-consumers.json', 'utf8'));
          const objects = [];
          const visit = (value) => {
            if (!value || typeof value !== 'object') return;
            if (Array.isArray(value)) {
              for (const item of value) visit(item);
              return;
            }
            objects.push(value);
            for (const nested of Object.values(value)) visit(nested);
          };
          visit(payload);
          const consumer = objects.find((row) =>
            row?.settings && String(row?.script_name || row?.script || '').includes('catalog-engine-import-detail')
          ) || objects.find((row) => row?.settings?.batch_size !== undefined);
          if (!consumer?.settings) throw new Error('IC4B detail consumer settings missing');
          const settings = consumer.settings;
          if (Number(settings.batch_size) !== 1) throw new Error('IC4B detail batch size is not 1');
          if (Number(settings.max_concurrency) !== 4) throw new Error('IC4B detail max concurrency is not 4');
          if (Number(settings.max_retries) !== 5) throw new Error('IC4B detail max retries changed');
          if (Number(settings.max_wait_time_ms) !== 5000) throw new Error('IC4B detail batch timeout changed');
          if (Number(settings.retry_delay) !== 120) throw new Error('IC4B detail retry delay changed');
          if (!String(consumer.dead_letter_queue || '').includes('catalog-engine-import-detail-dlq')) {
            throw new Error('IC4B detail DLQ is missing');
          }
          console.log('IC4B detail consumer verified: batch=1 max_concurrency=4 retries=5 timeout=5s');
          NODE

      - name: Consumer deployment checkpoint
        shell: bash
        run: |
          echo "Tenant import Queue consumers are deployed and verified."
          echo "IC4B detail topology is batch=1 with max_concurrency=4 and the existing retry/DLQ policy."
          echo "wrangler.import-detail.jsonc remains the explicit 4/2 rollback template."
          echo "Automation state is owned by wrangler.jsonc and is not changed by this workflow."

      - name: Publish successful activation evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg state success \
            --arg context "$STATUS_CONTEXT" \
            --arg description "Queues verified; IC4B detail batch=1/max=4; retry+DLQ and automation boundary preserved" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d @/tmp/status.json

      - name: Publish failed activation evidence
        if: ${{ failure() && steps.target.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg state failure \
            --arg context "$STATUS_CONTEXT" \
            --arg description "Queue consumer deployment or IC4B topology verification failed; inspect before retry" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d @/tmp/status.json
