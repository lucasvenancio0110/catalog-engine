name: Activate tenant import Queue consumers

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/activate-tenant-import-queues.yml"
      - "wrangler.import-scan.jsonc"
      - "wrangler.import-detail.jsonc"
      - "scripts/cloudflare-tenant-data-plane-fleet-prepare.mjs"
      - "worker/import-scan-entry.js"
      - "worker/import-detail-entry.js"
      - "worker/ingestion/**"
      - "worker/tenant-data-plane-command.js"
      - "worker/cloudflare-platform.js"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  # Worker/Queue control-plane mutations must not overlap the application
  # deploy or trusted production canaries that use the same Worker/Queues.
  group: catalog-engine-production-d1
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.123.0
      STATUS_CONTEXT: catalog-engine/queue-consumer-activation

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Quality gate before production mutation
        run: npm run quality

      - name: Validate tenant import automation setting
        shell: bash
        run: |
          set -euo pipefail
          AUTOMATION_VALUE="$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(String(c.vars?.TENANT_IMPORT_AUTOMATION_ENABLED || ''));" )"
          test "$AUTOMATION_VALUE" = "0" -o "$AUTOMATION_VALUE" = "1" || { echo "Invalid tenant import automation setting"; exit 1; }
          echo "TENANT_IMPORT_AUTOMATION_ENABLED=$AUTOMATION_VALUE"

      - name: Ensure primary and dead-letter Queues exist
        shell: bash
        run: |
          set -euo pipefail
          QUEUES=(
            catalog-engine-import-scan
            catalog-engine-import-detail
            catalog-engine-import-scan-dlq
            catalog-engine-import-detail-dlq
          )
          npx --yes "wrangler@$WRANGLER_VERSION" queues list | tee /tmp/catalog-engine-queues.txt
          for queue in "${QUEUES[@]}"; do
            if grep -Fq "$queue" /tmp/catalog-engine-queues.txt; then
              echo "Queue already exists: $queue"
            else
              echo "Creating Queue: $queue"
              npx --yes "wrangler@$WRANGLER_VERSION" queues create "$queue"
            fi
          done
          npx --yes "wrangler@$WRANGLER_VERSION" queues list | tee /tmp/catalog-engine-queues-final.txt
          for queue in "${QUEUES[@]}"; do
            grep -Fq "$queue" /tmp/catalog-engine-queues-final.txt || { echo "Queue missing after ensure: $queue"; exit 1; }
          done

      - name: Deploy detail consumer first
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.import-detail.jsonc

      - name: Deploy scan consumer
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.import-scan.jsonc

      - name: Verify Queue consumers and policies are attached
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" queues info catalog-engine-import-scan
          npx --yes "wrangler@$WRANGLER_VERSION" queues info catalog-engine-import-detail
          npx --yes "wrangler@$WRANGLER_VERSION" queues consumer worker list catalog-engine-import-scan --json | tee /tmp/scan-consumers.json
          npx --yes "wrangler@$WRANGLER_VERSION" queues consumer worker list catalog-engine-import-detail --json | tee /tmp/detail-consumers.json
          grep -Fq 'catalog-engine-import-scan' /tmp/scan-consumers.json || { echo "Scan consumer not attached"; exit 1; }
          grep -Fq 'catalog-engine-import-detail' /tmp/detail-consumers.json || { echo "Detail consumer not attached"; exit 1; }

      - name: Consumer deployment checkpoint
        shell: bash
        run: |
          echo "Tenant import Queue consumers are deployed and verified."
          echo "Automation state is owned by wrangler.jsonc and is not changed by this workflow."

      - name: Publish successful activation evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg state success \
            --arg context "$STATUS_CONTEXT" \
            --arg description "4 Queues + 2 consumers verified; automation setting preserved" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d @/tmp/status.json

      - name: Publish failed activation evidence
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg state failure \
            --arg context "$STATUS_CONTEXT" \
            --arg description "Queue consumer deployment failed; inspect automation state before retry" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d @/tmp/status.json
