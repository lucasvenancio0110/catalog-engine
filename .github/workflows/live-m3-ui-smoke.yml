name: Verify live M3 UI

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/live-m3-ui-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify isolated UI staging Worker
        shell: bash
        env:
          PREVIEW_URL: https://catalog-engine-ui-preview.lucassantanals0110.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PREVIEW_URL/api/health" > /tmp/health.json
          curl --fail --silent --show-error "$PREVIEW_URL/api/catalog/meta" > /tmp/meta.json
          curl --fail --silent --show-error "$PREVIEW_URL/api/products?page=1&limit=15" > /tmp/products.json
          curl --fail --silent --show-error "$PREVIEW_URL/" > /tmp/storefront.html
          curl --fail --silent --show-error "$PREVIEW_URL/app.html" > /tmp/app.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const meta = JSON.parse(fs.readFileSync('/tmp/meta.json', 'utf8'));
          const products = JSON.parse(fs.readFileSync('/tmp/products.json', 'utf8'));
          const storefront = fs.readFileSync('/tmp/storefront.html', 'utf8');
          const app = fs.readFileSync('/tmp/app.html', 'utf8');
          if (!health.ok || !health.preview) throw new Error('staging health failed');
          if (!Number(meta.stats?.products) || !products.items?.length) throw new Error('staging demo catalog empty');
          if (!storefront.includes('data-lucide="sun"')) throw new Error('staging storefront is not M3');
          if (!(app.includes('Catalog Engine — Portal') || app.includes('id="app"'))) throw new Error('staging portal missing');
          console.log(JSON.stringify({ previewUrl: process.env.PREVIEW_URL, products: meta.stats.products, portal: true, ok: true }, null, 2));
          NODE
