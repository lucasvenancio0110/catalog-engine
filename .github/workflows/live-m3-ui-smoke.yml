name: Verify live M3 UI

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/live-m3-ui-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify custom Catalog Engine hosts
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://catalogoengine.com/ > /tmp/custom-storefront.html
          curl --fail --silent --show-error https://catalogoengine.com/api/health > /tmp/custom-health.json
          curl --fail --silent --show-error https://catalogoengine.com/api/catalog/meta > /tmp/custom-meta.json
          curl --fail --silent --show-error https://app.catalogoengine.com/ > /tmp/custom-app.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const storefront = fs.readFileSync('/tmp/custom-storefront.html', 'utf8');
          const app = fs.readFileSync('/tmp/custom-app.html', 'utf8');
          const health = JSON.parse(fs.readFileSync('/tmp/custom-health.json', 'utf8'));
          const meta = JSON.parse(fs.readFileSync('/tmp/custom-meta.json', 'utf8'));
          if (!health.ok) throw new Error('catalogoengine.com health is not OK');
          if (!Number(meta.stats?.products)) throw new Error('catalogoengine.com catalog metadata is empty');
          if (!storefront.includes('data-lucide="sun"')) throw new Error('catalogoengine.com is not serving the M3 storefront yet');
          if (!storefront.includes('data-lucide="message-circle"')) throw new Error('catalogoengine.com is missing the M3 WhatsApp icon');
          if (!(app.includes('Catalog Engine — Portal') || app.includes('id="app"'))) throw new Error('app.catalogoengine.com does not look like the portal');
          console.log(JSON.stringify({
            storefrontUrl: 'https://catalogoengine.com/',
            appUrl: 'https://app.catalogoengine.com/',
            health: health.ok,
            products: meta.stats.products,
            m3Storefront: true,
            appHostLooksLikePortal: true
          }, null, 2));
          NODE

      - name: Probe legacy workers.dev host without blocking custom-host verification
        continue-on-error: true
        shell: bash
        env:
          EDGE_URL: https://catalog-engine.lucassantanals0110.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$EDGE_URL/api/health" > /tmp/legacy-health.json
