name: M7D9 diagnostic gate

on:
  push:
    branches: ['m7d9/repeated-miss-safe-removal-v1']
    paths:
      - '.github/workflows/m7d9-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: m7d9/repeated-miss-safe-removal-v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply M7D9 integration
        run: node scripts/m7d9-integrate.mjs
      - name: Diff sanity
        run: git diff --check
      - name: Dependency policy
        run: npm run deps:check
      - name: Tests
        run: npm run test
      - name: ESLint
        if: always()
        run: npm run lint
