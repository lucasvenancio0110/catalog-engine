name: Cloudflare custom hostname tenant smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-custom-hostname-tenant-smoke.yml'
      - 'scripts/cloudflare-custom-hostname-tenant-smoke.mjs'
      - 'worker/cloudflare-platform.js'
      - 'worker/tenant-catalog-runtime.js'
      - 'worker/tenant-routing.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-custom-hostname-tenant-smoke
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate without Cloudflare credentials
        run: npm run quality

  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      CATALOG_ENGINE_TEST_HOSTNAME: teste.loja.catalogoengine.com
      CATALOG_ENGINE_DEFAULT_URL: https://catalog-engine.lucassantanals0110.workers.dev

    steps:
      - name: Checkout trusted ref
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run quality

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing' >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing' >&2; exit 1; }

      - name: Provision isolated tenant behind active Custom Hostname
        run: node scripts/cloudflare-custom-hostname-tenant-smoke.mjs setup

      - name: Prove live hostname dispatch and cross-tenant isolation
        shell: bash
        run: |
          set -u
          META_URL="https://${CATALOG_ENGINE_TEST_HOSTNAME}/api/catalog/meta"

          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Live verification attempt ${attempt}/8"
            if node scripts/cloudflare-custom-hostname-tenant-smoke.mjs verify; then
              exit 0
            fi

            status="$(curl --silent --show-error --max-time 15 --output /tmp/custom-meta-body.txt --write-out '%{http_code}' "$META_URL" || true)"
            echo "Custom hostname meta diagnostic: HTTP ${status:-curl_failed}"
            if test -s /tmp/custom-meta-body.txt; then
              echo 'Response body (first 400 bytes):'
              head -c 400 /tmp/custom-meta-body.txt
              echo
            fi

            if test "$attempt" -lt 8; then
              sleep "$((attempt * 2))"
            fi
          done

          echo 'Live custom-hostname verification did not become healthy within the bounded propagation window.' >&2
          exit 1

      - name: Keep smoke tenant available for manual Safari verification
        run: |
          echo 'teste.loja.catalogoengine.com remains attached to the isolated smoke tenant.'
          echo 'Run: node scripts/cloudflare-custom-hostname-tenant-smoke.mjs cleanup when the manual test is finished.'
