name: Cloudflare incremental finalization canary

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-m7d8-finalization-canary.yml'
      - 'migrations/0021_tenant_sync_finalization.sql'
      - 'scripts/cloudflare-m7d8-finalization-canary.mjs'
      - 'worker/entry.js'
      - 'worker/tenant-sync-scheduler.js'
      - 'worker/ingestion/incremental-finalization-runner.js'
      - 'worker/ingestion/incremental-promotion.js'
      - 'tests/tenant-incremental-finalization.test.mjs'
      - 'tests/tenant-sync-scheduler.test.mjs'
      - 'tests/tenant-sync-activation-boundary.test.mjs'
  workflow_run:
    workflows: ['Deploy Catalog Engine application']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: catalog-engine-m7d8-incremental-finalization-canary
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret-free quality gate
        run: npm run quality

  canary:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      APPLICATION_STATUS_CONTEXT: catalog-engine/application-deploy
      M7D7_STATUS_CONTEXT: catalog-engine/tenant-incremental-promotion-authority-canary
      M7D8_STATUS_CONTEXT: catalog-engine/tenant-incremental-finalization-canary

    steps:
      - name: Resolve exact trusted-main SHA
        id: target
        env:
          EVENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVENT_SHA" || { echo "Missing target SHA"; exit 1; }
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exactly the deployed trusted-main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate before production canary
        run: npm run quality

      - name: Validate trusted Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }

      - name: Wait for exact-SHA deploy and M7D7 authority regression
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            STATUS_JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/commits/$SHA/status")"
            APP_STATE="$(printf '%s' "$STATUS_JSON" | jq -r --arg c "$APPLICATION_STATUS_CONTEXT" '[.statuses[] | select(.context==$c)][0].state // "missing"')"
            D7_STATE="$(printf '%s' "$STATUS_JSON" | jq -r --arg c "$M7D7_STATUS_CONTEXT" '[.statuses[] | select(.context==$c)][0].state // "missing"')"
            if [ "$APP_STATE" = success ] && [ "$D7_STATE" = success ]; then
              exit 0
            fi
            case "$APP_STATE:$D7_STATE" in
              *failure*|*error*)
                echo "Exact-SHA prerequisite failed: app=$APP_STATE m7d7=$D7_STATE"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Exact-SHA application/M7D7 evidence did not arrive"
          exit 1

      - name: Prove promotion-before-control finalization and crash replay
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-m7d8-finalization-canary.mjs | tee /tmp/m7d8-canary.json
          cat /tmp/m7d8-canary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish successful M7D8 canary evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$M7D8_STATUS_CONTEXT" \
            --arg description "Promoted authority precedes control commit; post-promotion replay finalizes once" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json

      - name: Publish failed M7D8 canary evidence
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state failure --arg context "$M7D8_STATUS_CONTEXT" \
            --arg description "M7D8 finalization ordering/replay proof failed; retain isolated evidence" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
