name: Reconcile complete Yupoo catalog

on:
  schedule:
    # Weekly authoritative reconciliation. 07:17 UTC = 04:17 in Brasília/Curitiba (UTC-3).
    - cron: "17 7 * * 0"
  workflow_dispatch:
    inputs:
      source_url:
        description: "Yupoo catalog source (/albums/)"
        required: true
        default: "https://zhouchangliang.x.yupoo.com/albums/"
        type: string
      max_products:
        description: "0 imports the complete catalog; use a positive number only for controlled testing"
        required: true
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: complete-yupoo-catalog-import
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_URL: ${{ inputs.source_url || 'https://zhouchangliang.x.yupoo.com/albums/' }}
      MAX_PRODUCTS: ${{ inputs.max_products || '0' }}
      MAX_ROOT_PAGES: "500"
      MAX_CATEGORY_PAGES: "500"
      CATALOG_SQL_DIR: /tmp/catalog-engine-full-sql
      PUBLIC_CATALOG_SQL_DIR: /tmp/catalog-engine-public-api-sql
      IMPORT_SUMMARY_OUT: /tmp/catalog-engine-full-summary.json
      WRANGLER_VERSION: 4.123.0
      PUBLIC_URL: https://catalog-engine.lucassantanals0110.workers.dev

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Install project dependencies
        run: npm ci

      - name: Quality gate before external crawl
        run: npm run quality

      - name: Apply D1 migrations
        run: npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply CATALOG_DB --remote --config wrangler.jsonc

      - name: Discover all products and map source categories
        run: |
          node scripts/import-full-yupoo.mjs "$SOURCE_URL"
          cat "$IMPORT_SUMMARY_OUT"
          cat "$IMPORT_SUMMARY_OUT" >> "$GITHUB_STEP_SUMMARY"

      - name: Audit generated taxonomy and edge media
        run: |
          npm run taxonomy:audit
          node scripts/remote-media-audit.mjs

      - name: Load private media registry into D1 in chunks
        shell: bash
        run: |
          shopt -s nullglob
          files=("$CATALOG_SQL_DIR"/*.sql)
          test ${#files[@]} -gt 0 || { echo "No SQL chunks were generated"; exit 1; }
          for file in "${files[@]}"; do
            echo "Applying $(basename "$file")"
            npx --yes "wrangler@$WRANGLER_VERSION" d1 execute CATALOG_DB --remote --config wrangler.jsonc --file="$file"
          done

      - name: Rebuild normalized public catalog SQL
        run: node scripts/sync-public-catalog-d1.mjs

      - name: Load normalized public catalog into D1
        shell: bash
        run: |
          shopt -s nullglob
          files=("$PUBLIC_CATALOG_SQL_DIR"/*.sql)
          test ${#files[@]} -gt 0 || { echo "No public catalog SQL chunks were generated"; exit 1; }
          for file in "${files[@]}"; do
            echo "Applying public $(basename "$file")"
            npx --yes "wrangler@$WRANGLER_VERSION" d1 execute CATALOG_DB --remote --config wrangler.jsonc --file="$file"
          done

      - name: Verify remote catalog
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute CATALOG_DB --remote --config wrangler.jsonc --command="SELECT COUNT(*) AS media_sources FROM media_sources; SELECT COUNT(*) AS product_media FROM product_media; SELECT COUNT(*) AS catalog_products FROM catalog_products;"

      - name: Build storefront
        run: |
          npm run build
          npm run build:verify

      - name: Deploy Worker and catalog
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.jsonc

      - name: Smoke test catalog and optimized media
        shell: bash
        run: |
          curl --fail --silent --show-error "$PUBLIC_URL/api/health"
          curl --fail --silent --show-error "$PUBLIC_URL/api/products?page=1&limit=15" > /tmp/products.json
          node --input-type=module <<'NODE' > /tmp/smoke-media.txt
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('data/catalog.json', 'utf8'));
          if (!catalog.products?.length) process.exit(1);
          const media = catalog.products[0]?.media?.[0];
          if (!media?.thumbnailUrl || !media?.url || !media?.downloadUrl) process.exit(1);
          console.log(media.thumbnailUrl);
          console.log(media.url);
          console.log(media.downloadUrl);
          NODE
          while IFS= read -r path; do
            curl --fail --silent --show-error --head "$PUBLIC_URL$path"
          done < /tmp/smoke-media.txt

      - name: Warm first catalog screens in Cloudflare cache
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('data/catalog.json', 'utf8'));
          const products = catalog.products || [];
          const thumbs = [...new Set(products.map((product) => product.media?.[0]?.thumbnailUrl).filter(Boolean))].slice(0, 120);
          const views = [...new Set(products.map((product) => product.media?.[0]?.url).filter(Boolean))].slice(0, 30);
          fs.writeFileSync('/tmp/warm-thumbs.txt', thumbs.map((url) => `${process.env.PUBLIC_URL}${url}`).join('\n') + '\n');
          fs.writeFileSync('/tmp/warm-views.txt', views.map((url) => `${process.env.PUBLIC_URL}${url}`).join('\n') + '\n');
          NODE
          xargs -r -n1 -P10 curl --fail --silent --show-error --output /dev/null < /tmp/warm-thumbs.txt
          xargs -r -n1 -P6 curl --fail --silent --show-error --output /dev/null < /tmp/warm-views.txt

      - name: Persist sanitized complete catalog
        shell: bash
        run: |
          git config user.name "catalog-engine-bot"
          git config user.email "catalog-engine-bot@users.noreply.github.com"
          git add data/catalog.json
          if git diff --cached --quiet; then
            echo "Complete catalog is already materialized."
          else
            git commit -m "reconcile complete supplier catalog"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
