name: Importar catálogo Yupoo

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL pública do catálogo Yupoo (/albums/)"
        required: true
        default: "https://zhouchangliang.x.yupoo.com/albums/"
        type: string
      max_albums:
        description: "Quantidade máxima de produtos comerciais no MVP (até 120 enquanto usamos GitHub como storage)"
        required: true
        default: "40"
        type: string
      max_pages:
        description: "Quantidade máxima de páginas do Yupoo para varrer"
        required: true
        default: "3"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  import:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar exatamente pelo lockfile
        run: npm ci

      - name: Quality gate do motor
        run: npm run quality

      - name: Varrer, classificar e baixar fotos HD
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          MAX_ALBUMS: ${{ inputs.max_albums }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: npm run crawl -- "$SOURCE_URL"

      - name: Auditar schema e mídia
        run: npm run audit

      - name: Validar estado white-label
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const catalog = JSON.parse(fs.readFileSync('data/catalog.json', 'utf8'));
          if (!Array.isArray(catalog.products) || catalog.products.length === 0) {
            throw new Error('Nenhum produto comercial foi extraído.');
          }
          if (!fs.existsSync('data/source-state.json')) {
            throw new Error('Estado interno da fonte não foi gerado durante a execução.');
          }

          const images = catalog.products.flatMap((product) => product.images || []);
          const missing = images.filter((image) => !fs.existsSync(image.replace(/^\.\//, '')));
          const supplierLeak = /x\.yupoo\.com|photo\.yupoo\.com/i.test(JSON.stringify(catalog));

          console.log(JSON.stringify({
            products: catalog.products.length,
            pagesScanned: catalog.crawl?.pagesScanned,
            candidatesScanned: catalog.crawl?.candidatesScanned,
            taxonomyEntries: catalog.crawl?.taxonomyEntries || 0,
            filteredNonCommercial: (catalog.crawl?.skippedNavigation || 0) + (catalog.crawl?.skippedInformation || 0),
            images: images.length,
            missingImages: missing.length,
            supplierLeak
          }, null, 2));

          if (!images.length || missing.length || supplierLeak) process.exit(1);
          NODE

      - name: Build Vite de produção
        run: npm run build

      - name: Auditar dist publicável
        run: npm run build:verify

      - name: Verificar vulnerabilidades runtime
        run: npm audit --omit=dev --audit-level=high

      - name: Salvar somente catálogo público e imagens
        run: |
          git config user.name "catalog-engine-bot"
          git config user.email "catalog-engine-bot@users.noreply.github.com"
          git add data/catalog.json assets/catalog
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pública no catálogo."
          else
            git commit -m "update classified catalog and HD images"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site Vite
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
