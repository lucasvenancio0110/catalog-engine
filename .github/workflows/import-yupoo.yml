name: Importar catálogo Yupoo

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/catalog.json"
      - "assets/catalog/**"
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL pública do catálogo Yupoo (/albums/)"
        required: true
        default: "https://zhouchangliang.x.yupoo.com/albums/"
        type: string
      max_albums:
        description: "Quantidade máxima de produtos no MVP (até 120 enquanto usamos GitHub como storage)"
        required: true
        default: "40"
        type: string
      max_pages:
        description: "Quantidade máxima de páginas do Yupoo para varrer"
        required: true
        default: "3"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  import:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Varrer páginas, extrair produtos e baixar fotos HD
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url || 'https://zhouchangliang.x.yupoo.com/albums/' }}
          MAX_ALBUMS: ${{ github.event.inputs.max_albums || '40' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
        run: node scripts/crawl-yupoo.mjs "$SOURCE_URL"

      - name: Validar catálogo consolidado e arquivos locais
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('data/catalog.json','utf8')); if (!Array.isArray(c.products) || c.products.length === 0) { console.error('Nenhum produto foi extraído.'); process.exit(1); } const imgs=c.products.flatMap(p => p.images || []); const missing=imgs.filter(i => !fs.existsSync(i.replace(/^\.\//,''))); console.log('Produtos extraídos:', c.products.length); console.log('Páginas varridas:', c.crawl?.pagesScanned); console.log('Fotos HD baixadas:', imgs.length); console.log('Categorias de origem detectadas:', c.crawl?.categoryIds?.length || 0); if (!imgs.length || missing.length) { console.error('Falha na validação das imagens locais.', {missing: missing.slice(0,5)}); process.exit(1); }"

      - name: Salvar catálogo e imagens atualizados
        run: |
          git config user.name "catalog-engine-bot"
          git config user.email "catalog-engine-bot@users.noreply.github.com"
          git add data/catalog.json assets/catalog
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no catálogo."
          else
            git commit -m "update paginated imported catalog and HD images"
            git push origin main
          fi

      - name: Preparar site estático
        run: |
          rm -rf dist
          mkdir -p dist/data
          cp index.html app.js styles.css dist/
          cp data/catalog.json dist/data/catalog.json
          if [ -d assets ]; then cp -R assets dist/assets; fi
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
