name: Importar catálogo Yupoo

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/catalog.json"
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL pública do catálogo Yupoo (/albums/)"
        required: true
        default: "https://zhouchangliang.x.yupoo.com/albums/"
        type: string
      max_albums:
        description: "Quantidade de álbuns para o teste"
        required: true
        default: "20"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  import:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Extrair catálogo
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url || 'https://zhouchangliang.x.yupoo.com/albums/' }}
          MAX_ALBUMS: ${{ github.event.inputs.max_albums || '20' }}
        run: npm run scrape -- "$SOURCE_URL"

      - name: Validar catálogo extraído
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('data/catalog.json','utf8')); if (!Array.isArray(c.products) || c.products.length === 0) { console.error('Nenhum produto foi extraído.'); process.exit(1); } console.log('Produtos extraídos:', c.products.length); console.log('Produtos com imagem:', c.products.filter(p => Array.isArray(p.images) && p.images.length).length);"

      - name: Salvar catálogo atualizado
        run: |
          git config user.name "catalog-engine-bot"
          git config user.email "catalog-engine-bot@users.noreply.github.com"
          git add data/catalog.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no catálogo."
          else
            git commit -m "update imported catalog"
            git push origin main
          fi

      - name: Preparar site estático
        run: |
          rm -rf dist
          mkdir -p dist/data
          cp index.html app.js styles.css dist/
          cp data/catalog.json dist/data/catalog.json
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
