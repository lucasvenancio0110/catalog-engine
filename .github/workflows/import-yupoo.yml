name: Importar catálogo Yupoo

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL pública do catálogo Yupoo (/albums/)"
        required: true
        default: "https://zhouchangliang.x.yupoo.com/albums/"
        type: string
      max_albums:
        description: "Quantidade máxima de produtos comerciais no MVP (até 120 enquanto usamos GitHub como storage)"
        required: true
        default: "40"
        type: string
      max_pages:
        description: "Quantidade máxima de páginas do Yupoo para varrer"
        required: true
        default: "3"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  import:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar exatamente pelo lockfile
        run: npm ci

      - name: Quality gate do motor
        run: npm run quality

      - name: Guardar catálogo anterior para relatório
        run: |
          if [ -f data/catalog.json ]; then
            cp data/catalog.json /tmp/catalog-before.json
          else
            echo '{"products":[]}' > /tmp/catalog-before.json
          fi

      - name: Varrer, classificar, sincronizar e baixar fotos HD
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          MAX_ALBUMS: ${{ inputs.max_albums }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: npm run crawl -- "$SOURCE_URL"

      - name: Auditar schema e mídia
        run: npm run audit

      - name: Auditar identidade e estado de sincronização
        run: npm run sync:audit

      - name: Gerar relatório de mudanças
        run: |
          node scripts/sync-report.mjs \
            --before /tmp/catalog-before.json \
            --after data/catalog.json \
            --state data/sync-state.json \
            --out /tmp/sync-report.md
          cat /tmp/sync-report.md >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/sync-report.md

      - name: Validar estado interno efêmero
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          if (!fs.existsSync('data/source-state.json')) {
            throw new Error('Estado interno da fonte não foi gerado durante a execução.');
          }
          const catalog = JSON.parse(fs.readFileSync('data/catalog.json', 'utf8'));
          const syncState = JSON.parse(fs.readFileSync('data/sync-state.json', 'utf8'));
          console.log(JSON.stringify({
            publicProducts: catalog.products?.length || 0,
            observedProducts: catalog.sync?.observedProducts || 0,
            scopeComplete: syncState.scope?.complete || false,
            stopReason: syncState.scope?.stopReason || null,
            changes: syncState.summary
          }, null, 2));
          NODE

      - name: Build Vite de produção
        run: npm run build

      - name: Auditar dist publicável
        run: npm run build:verify

      - name: Verificar vulnerabilidades runtime
        run: npm audit --omit=dev --audit-level=high

      - name: Salvar catálogo, sync-state sanitizado e imagens
        run: |
          git config user.name "catalog-engine-bot"
          git config user.email "catalog-engine-bot@users.noreply.github.com"
          git add data/catalog.json data/sync-state.json assets/catalog
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pública/sanitizada no catálogo."
          else
            git commit -m "sync catalog and HD images"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site Vite
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
