name: Cloudflare IC3 listing production proof

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-ic3-listing-production-proof.yml'
      - 'scripts/cloudflare-ic3-listing-proof.mjs'
      - 'tests/ic3-listing-production-proof.test.mjs'
      - 'tests/ic3-proof-provider-path.test.mjs'
      - 'tests/ic3-gallery-route.test.mjs'
      - 'tests/ic3-progressive-construction.test.mjs'
      - 'tests/tenant-import-scan.test.mjs'
      - 'worker/instant-catalog-construction.js'
      - 'worker/ingestion/ic3-listing-proof-contract.js'
      - 'worker/ingestion/initial-construction-progress.js'
      - 'worker/ingestion/yupoo-listing.js'
      - 'worker/ingestion/providers/**'
      - 'src/catalog-provider/**'
      - 'wrangler.import-scan.jsonc'
      - 'wrangler.jsonc'
  workflow_run:
    workflows: ['Deploy Catalog Engine application']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify IC3 proof, progressive construction and scanner contracts
        run: >-
          npx vitest run
          tests/ic3-listing-production-proof.test.mjs
          tests/ic3-proof-provider-path.test.mjs
          tests/ic3-gallery-route.test.mjs
          tests/ic3-progressive-construction.test.mjs
          tests/tenant-import-scan.test.mjs
      - name: Secret-free quality gate
        run: npm run quality

  prove:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: catalog-engine-ic3-listing-proof
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IC3_MERCHANT_DISPLAY_NAME: CROCCODILOS
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      STATUS_CONTEXT: catalog-engine/ic3-production-proof
    steps:
      - name: Checkout exact trusted-main SHA with baseline history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify IC3 proof, progressive construction and scanner contracts
        run: >-
          npx vitest run
          tests/ic3-listing-production-proof.test.mjs
          tests/ic3-proof-provider-path.test.mjs
          tests/ic3-gallery-route.test.mjs
          tests/ic3-progressive-construction.test.mjs
          tests/tenant-import-scan.test.mjs
      - name: Validate trusted proof prerequisites and exact deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$TARGET_SHA" || { echo 'TARGET_SHA is missing'; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const db = config.d1_databases?.find((entry) => entry.binding === 'CATALOG_DB');
          if (!db?.database_id) throw new Error('IC3 proof control D1 binding missing');
          if (config.vars?.TENANT_IMPORT_AUTOMATION_ENABLED !== '1') throw new Error('Initial import automation must remain enabled');
          if (config.vars?.TENANT_SYNC_AUTOMATION_ENABLED !== '0') throw new Error('Recurring Intelligent Sync must remain disabled');
          if (String(config.vars?.TENANT_SYNC_ACTIVE_COHORT || '') !== '') throw new Error('Recurring sync cohort must remain empty');
          if (String(config.vars?.TENANT_SYNC_MAX_JOBS_PER_TICK || '') !== '1') throw new Error('Recurring sync max jobs boundary changed');
          NODE
          STATUS_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status")"
          DEPLOY_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context == "catalog-engine/application-deploy")][0].state // "missing"')"
          test "$DEPLOY_STATE" = 'success' || { echo "Exact SHA application deploy state=$DEPLOY_STATE"; exit 1; }
          echo 'exact_sha_application_deploy=success'
      - name: Measure real IC3 listing path against pre-IC3 scanner
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-ic3-listing-proof.mjs | tee /tmp/ic3-listing-production-proof.json
          jq -e '
            .ic3ProductionProof == "passed" and
            (.baselineMs | type == "number") and
            (.fanoutMs | type == "number") and
            .fanoutMs >= 0 and
            .baselineMs > .fanoutMs and
            .improvementPct >= .minimumImprovementPct and
            .productCount > 0 and
            .identityMatch == true and
            .taxonomyMatch == true and
            .fanoutRequests > 0 and
            .baselineRequests > 0 and
            .fanoutMaxActive >= 1 and
            .fanoutMaxActive <= .requestConcurrency and
            .baselineMaxActive >= 1 and
            .progressiveBatches > 0 and
            .progressiveItems > 0 and
            .progressiveItems <= 48 and
            .privateIdentifiersExposed == false and
            .recurringIntelligentSyncEnabled == false
          ' /tmp/ic3-listing-production-proof.json >/dev/null
          jq '{
            ic3ProductionProof,
            contractVersion,
            merchant,
            baselineMs,
            fanoutMs,
            improvementPct,
            speedupRatio,
            productCount,
            identityMatch,
            taxonomyMatch,
            baselinePages,
            fanoutPages,
            baselineRequests,
            fanoutRequests,
            baselineMaxActive,
            fanoutMaxActive,
            progressiveBatches,
            progressiveItems,
            requestConcurrency,
            minimumImprovementPct,
            initialImportEnabled,
            recurringIntelligentSyncEnabled,
            privateIdentifiersExposed
          }' /tmp/ic3-listing-production-proof.json | tee /tmp/ic3-listing-production-proof-safe.json
          cat /tmp/ic3-listing-production-proof-safe.json >> "$GITHUB_STEP_SUMMARY"
          echo "result=$(jq -r '.ic3ProductionProof' /tmp/ic3-listing-production-proof.json)" >> "$GITHUB_OUTPUT"
          echo "improvement_pct=$(jq -r '.improvementPct' /tmp/ic3-listing-production-proof.json)" >> "$GITHUB_OUTPUT"
          echo "speedup_ratio=$(jq -r '.speedupRatio' /tmp/ic3-listing-production-proof.json)" >> "$GITHUB_OUTPUT"
          echo "product_count=$(jq -r '.productCount' /tmp/ic3-listing-production-proof.json)" >> "$GITHUB_OUTPUT"
      - name: Wait for exact-SHA Queue deployment, PB9 and IC2 safety regressions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QUEUE_STATE='missing'
          PB9_STATE='missing'
          IC2_STATE='missing'
          for attempt in $(seq 1 72); do
            STATUS_JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status")"
            QUEUE_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context == "catalog-engine/queue-consumer-activation")][0].state // "missing"')"
            PB9_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context == "catalog-engine/pb9-production-proof")][0].state // "missing"')"
            IC2_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context == "catalog-engine/ic2-production-proof")][0].state // "missing"')"
            if test "$QUEUE_STATE" = 'success' -a "$PB9_STATE" = 'success' -a "$IC2_STATE" = 'success'; then
              echo 'queue_scan_consumer_deployment=success'
              echo 'pb9_verified_lkg=success'
              echo 'ic2_construction_regression=success'
              exit 0
            fi
            if test "$QUEUE_STATE" = 'failure' -o "$QUEUE_STATE" = 'error'; then
              echo "Queue exact-SHA deployment state=$QUEUE_STATE"
              exit 1
            fi
            if test "$PB9_STATE" = 'failure' -o "$PB9_STATE" = 'error'; then
              echo "PB9 exact-SHA proof state=$PB9_STATE"
              exit 1
            fi
            if test "$IC2_STATE" = 'failure' -o "$IC2_STATE" = 'error'; then
              echo "IC2 exact-SHA proof state=$IC2_STATE"
              exit 1
            fi
            sleep 10
          done
          echo "Exact-SHA dependencies: queue=$QUEUE_STATE pb9=$PB9_STATE ic2=$IC2_STATE"
          exit 1
      - name: Publish successful IC3 production evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROOF_RESULT: ${{ steps.evidence.outputs.result }}
          IMPROVEMENT_PCT: ${{ steps.evidence.outputs.improvement_pct }}
          SPEEDUP_RATIO: ${{ steps.evidence.outputs.speedup_ratio }}
          PRODUCT_COUNT: ${{ steps.evidence.outputs.product_count }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PROOF_RESULT" = 'passed' || { echo 'IC3 proof did not pass'; exit 1; }
          DESCRIPTION="IC3 listing ${SPEEDUP_RATIO}x; ${IMPROVEMENT_PCT}% faster; ${PRODUCT_COUNT} products identity stable"
          test "${#DESCRIPTION}" -le 140 || DESCRIPTION='IC3 listing faster with stable identity; Queue/PB9/IC2 green'
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description "$DESCRIPTION" --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/statuses/$TARGET_SHA" -d @/tmp/status.json
      - name: Publish failed IC3 diagnostic evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA" || exit 0
          jq -n --arg state failure --arg context "$STATUS_CONTEXT" \
            --arg description 'IC3 listing production proof failed; inspect trusted run' \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/statuses/$TARGET_SHA" -d @/tmp/status.json
