name: Cleanup retained fleet canaries

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-cleanup-retained-fleet-canaries.yml'
      - 'scripts/cloudflare-cleanup-retained-fleet-canaries.mjs'
      - 'tests/retained-fleet-canary-cleanup.test.mjs'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-cleanup-retained-fleet-canaries.yml'
      - 'scripts/cloudflare-cleanup-retained-fleet-canaries.mjs'
      - 'tests/retained-fleet-canary-cleanup.test.mjs'

permissions:
  contents: read
  statuses: write

concurrency:
  group: catalog-engine-production-d1
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret-free quality gate
        run: npm run quality

  cleanup:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      PROVEN_FLEET_CANARY_RUN_ID: '32685477736'
      STATUS_CONTEXT: catalog-engine/retained-fleet-canary-cleanup
    steps:
      - name: Checkout exact trusted-main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Quality gate before targeted cleanup
        run: npm run quality
      - name: Remove only exact retained fleet fixtures after proven canary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-cleanup-retained-fleet-canaries.mjs | tee /tmp/fleet-cleanup.json
          cat /tmp/fleet-cleanup.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish successful fleet cleanup evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description "Exact retained fleet fixtures removed after trusted v4-to-v5 proof" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
      - name: Publish failed fleet cleanup evidence
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state failure --arg context "$STATUS_CONTEXT" \
            --arg description "Retained fleet cleanup failed closed; inspect exact fixture evidence" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
