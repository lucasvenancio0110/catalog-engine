name: Provider engine quality

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/provider-engine-quality.yml"
      - "src/catalog-provider/**"
      - "src/domain/tenant-source-connection.js"
      - "scripts/catalog-source-resolver.mjs"
      - "scripts/connect-tenant-source.mjs"
      - "scripts/yupoo-source-resolver.mjs"
      - "worker/ingestion/**"
      - "tests/catalog-provider-contract.test.mjs"
      - "tests/tenant-import-*.test.mjs"
      - "tests/tenant-source-connection.test.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/provider-engine-quality.yml"
      - "src/catalog-provider/**"
      - "src/domain/tenant-source-connection.js"
      - "scripts/catalog-source-resolver.mjs"
      - "scripts/connect-tenant-source.mjs"
      - "scripts/yupoo-source-resolver.mjs"
      - "worker/ingestion/**"
      - "tests/catalog-provider-contract.test.mjs"
      - "tests/tenant-import-*.test.mjs"
      - "tests/tenant-source-connection.test.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run quality

      - name: Build application surfaces
        run: npm run build

      - name: Verify public artifact
        run: npm run build:verify
