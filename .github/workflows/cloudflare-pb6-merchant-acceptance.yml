name: Cloudflare PB6 merchant acceptance proof

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-pb6-merchant-acceptance.yml'
      - 'scripts/cloudflare-pb6-merchant-acceptance.mjs'
      - 'tests/pb6-merchant-acceptance.test.mjs'
  workflow_dispatch:
    inputs:
      merchant_display_name:
        description: Merchant display name to verify without exposing private tenant/source identifiers
        required: false
        default: CROCCODILOS
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: PB6 merchant proof tests
        run: node --test tests/pb6-merchant-acceptance.test.mjs
      - name: Secret-free quality gate
        run: npm run quality

  prove:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PB6_MERCHANT_DISPLAY_NAME: ${{ inputs.merchant_display_name }}
      STATUS_CONTEXT: catalog-engine/pb6-merchant-acceptance
    steps:
      - name: Checkout exact trusted-main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify PB6 proof contract
        run: node --test tests/pb6-merchant-acceptance.test.mjs
      - name: Validate trusted Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
      - name: Prove CROCCODILOS merchant acceptance safely
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-pb6-merchant-acceptance.mjs | tee /tmp/pb6-merchant-acceptance.json
          cat /tmp/pb6-merchant-acceptance.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish successful PB6 merchant acceptance evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description "PB6 merchant authority, source binding and initial-import consumption proven" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
      - name: Publish failed PB6 merchant acceptance evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state failure --arg context "$STATUS_CONTEXT" \
            --arg description "PB6 real merchant acceptance is still pending or invalid" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
