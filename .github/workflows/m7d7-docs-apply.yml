name: M7D7 apply architecture decision docs

on:
  push:
    branches:
      - docs/m7d7-promotion-authority-decision

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m7d7-promotion-authority-decision
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic decision docs
        run: node scripts/m7d7-architecture-decision-docs.mjs
      - name: Remove temporary updater workflow
        run: |
          rm -f scripts/m7d7-architecture-decision-docs.mjs
          rm -f .github/workflows/m7d7-docs-apply.yml
      - name: Verify generated diff is documentation/cleanup only
        run: |
          set -euo pipefail
          git diff --exit-code --check
          git status --short
          if git diff --name-only | grep -Ev '^(docs/|scripts/cloudflare-m7d7-d1-architecture-probe(-v2)?\.mjs$|\.github/workflows/cloudflare-m7d7-d1-architecture-probe(-v2)?\.yml$|scripts/m7d7-architecture-decision-docs\.mjs$|\.github/workflows/m7d7-docs-apply\.yml$)' ; then
            echo 'Unexpected non-documentation/runtime diff' >&2
            exit 1
          fi
      - name: Commit generated decision
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: accept M7D7 promotion authority decision'
          git push origin HEAD:docs/m7d7-promotion-authority-decision
