name: Deploy Catalog Engine application

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/deploy-catalog-api.yml'
      - '.github/workflows/activate-tenant-import-queues.yml'
      - '.github/workflows/cloudflare-incremental-scan-stage-canary.yml'
      - '.github/workflows/cloudflare-m7d8-finalization-canary.yml'
      - '.github/workflows/cloudflare-tenant-data-plane-fleet-canary.yml'
      - '.github/workflows/cloudflare-m7d9-removal-canary.yml'
      - '.github/workflows/cloudflare-m7d10-recovery-canary.yml'
      - '.github/workflows/cloudflare-auto-tenant-import-canary.yml'
      - 'index.html'
      - 'app.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'config/dependency-policy.json'
      - 'migrations/**'
      - 'scripts/build-worker-runtime-secrets.mjs'
      - 'scripts/cloudflare-incremental-scan-stage-canary.mjs'
      - 'scripts/cloudflare-m7d8-finalization-canary.mjs'
      - 'scripts/cloudflare-tenant-data-plane-fleet-canary.mjs'
      - 'scripts/cloudflare-m7d9-removal-canary.mjs'
      - 'scripts/cloudflare-m7d10-recovery-canary.mjs'
      - 'scripts/cloudflare-auto-tenant-import-canary.mjs'
      - 'scripts/d1-batch-chunks.mjs'
      - 'scripts/copy-storefront-data.mjs'
      - 'scripts/cloudflare-tenant-data-plane-fleet-prepare.mjs'
      - 'scripts/verify-dist.mjs'
      - 'scripts/verify-worker-platform-bindings.mjs'
      - 'tests/d1-batch-chunks.test.mjs'
      - 'tests/deployment-pipeline-boundary.test.mjs'
      - 'tests/worker-runtime-secrets.test.mjs'
      - 'tests/tenant-m7d8-finalization-canary.test.mjs'
      - 'tests/tenant-m7d9-removal-canary.test.mjs'
      - 'tests/tenant-m7d10-recovery-canary.test.mjs'
      - 'tests/tenant-import-auto-canary.test.mjs'
      - 'tests/tenant-data-plane-fleet-canary.test.mjs'
      - 'tests/tenant-data-plane-fleet-preparation.test.mjs'
      - 'src/**'
      - 'worker/**'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

# This workflow may apply schema migrations, so it shares the production-D1
# serialization group with catalog publication/sync jobs. It must not rebuild or
# replace catalog business data.
concurrency:
  group: catalog-engine-production-d1
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.123.0
      PUBLIC_URL: https://catalog-engine.lucassantanals0110.workers.dev
      STATUS_CONTEXT: catalog-engine/application-deploy

    steps:
      - name: Checkout triggering main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_PLATFORM_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PLATFORM_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PLATFORM_API_TOKEN: ${{ secrets.CLOUDFLARE_PLATFORM_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_PLATFORM_ACCOUNT_ID" || { echo "CLOUDFLARE_PLATFORM_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_PLATFORM_API_TOKEN" || { echo "CLOUDFLARE_PLATFORM_API_TOKEN is missing"; exit 1; }
          test "$CLOUDFLARE_PLATFORM_ACCOUNT_ID" = "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare platform account does not match the deploy account"; exit 1; }

      - name: Install project dependencies
        run: npm ci

      - name: Quality gate
        run: npm run quality

      - name: Build and verify application artifact
        run: |
          npm run build
          npm run build:verify

      - name: Apply D1 schema migrations
        run: npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply CATALOG_DB --remote --config wrangler.jsonc

      - name: Deploy Worker and static application assets
        env:
          CLOUDFLARE_PLATFORM_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PLATFORM_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PLATFORM_API_TOKEN: ${{ secrets.CLOUDFLARE_PLATFORM_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_AUTH_ISSUER: ${{ secrets.ADMIN_AUTH_ISSUER }}
          ADMIN_AUTH_AUDIENCE: ${{ secrets.ADMIN_AUTH_AUDIENCE }}
          ADMIN_AUTH_JWKS_URL: ${{ secrets.ADMIN_AUTH_JWKS_URL }}
          PORTAL_AUTH_CLIENT_ID: ${{ secrets.PORTAL_AUTH_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SECRETS="$(mktemp)"
          trap 'rm -f "$RUNTIME_SECRETS"' EXIT
          node scripts/build-worker-runtime-secrets.mjs "$RUNTIME_SECRETS"
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.jsonc --secrets-file "$RUNTIME_SECRETS"

      - name: Verify main Worker infrastructure and portal-auth secret bindings
        env:
          ADMIN_AUTH_ISSUER: ${{ secrets.ADMIN_AUTH_ISSUER }}
          ADMIN_AUTH_AUDIENCE: ${{ secrets.ADMIN_AUTH_AUDIENCE }}
          ADMIN_AUTH_JWKS_URL: ${{ secrets.ADMIN_AUTH_JWKS_URL }}
          PORTAL_AUTH_CLIENT_ID: ${{ secrets.PORTAL_AUTH_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          WORKER_SETTINGS="$(mktemp)"
          trap 'rm -f "$WORKER_SETTINGS"' EXIT
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/catalog-engine/settings" \
            > "$WORKER_SETTINGS"

          AUTH_COUNT=0
          for NAME in ADMIN_AUTH_ISSUER ADMIN_AUTH_AUDIENCE ADMIN_AUTH_JWKS_URL PORTAL_AUTH_CLIENT_ID; do
            if test -n "${!NAME}"; then AUTH_COUNT=$((AUTH_COUNT + 1)); fi
          done

          if test "$AUTH_COUNT" -eq 0; then
            node scripts/verify-worker-platform-bindings.mjs "$WORKER_SETTINGS" --require --forbid-portal-auth
          elif test "$AUTH_COUNT" -eq 4; then
            node scripts/verify-worker-platform-bindings.mjs "$WORKER_SETTINGS" --require --require-portal-auth
          else
            echo "Portal auth runtime configuration is partial" >&2
            exit 1
          fi

      - name: Prepare eligible tenant migration command capabilities from trusted CI
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-tenant-data-plane-fleet-prepare.mjs | tee /tmp/fleet-preparation.json
          cat /tmp/fleet-preparation.json >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tenant import producers and automation boundaries
        shell: bash
        run: |
          set -euo pipefail
          IMPORT_AUTOMATION_VALUE="$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(String(c.vars?.TENANT_IMPORT_AUTOMATION_ENABLED || ''));" )"
          SYNC_AUTOMATION_VALUE="$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(String(c.vars?.TENANT_SYNC_AUTOMATION_ENABLED || ''));" )"
          SYNC_COHORT_VALUE="$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(String(c.vars?.TENANT_SYNC_ACTIVE_COHORT || ''));" )"
          SYNC_LIMIT_VALUE="$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(String(c.vars?.TENANT_SYNC_MAX_JOBS_PER_TICK || ''));" )"
          test "$IMPORT_AUTOMATION_VALUE" = "0" -o "$IMPORT_AUTOMATION_VALUE" = "1" || { echo "Invalid tenant import automation setting"; exit 1; }
          test "$SYNC_AUTOMATION_VALUE" = "0" || { echo "TENANT_SYNC_AUTOMATION_ENABLED must remain 0 for M7D2"; exit 1; }
          test -z "$SYNC_COHORT_VALUE" || { echo "TENANT_SYNC_ACTIVE_COHORT must remain empty for M7D2"; exit 1; }
          test "$SYNC_LIMIT_VALUE" = "1" || { echo "TENANT_SYNC_MAX_JOBS_PER_TICK must remain 1 for M7D2"; exit 1; }
          echo "TENANT_IMPORT_AUTOMATION_ENABLED=$IMPORT_AUTOMATION_VALUE"
          echo "TENANT_SYNC_AUTOMATION_ENABLED=$SYNC_AUTOMATION_VALUE"
          echo "TENANT_SYNC_ACTIVE_COHORT=disabled"
          echo "TENANT_SYNC_MAX_JOBS_PER_TICK=$SYNC_LIMIT_VALUE"
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute CATALOG_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS enrollment_rows, COALESCE(SUM(CASE WHEN status='enrolled' THEN 1 ELSE 0 END),0) AS enrolled_rows FROM tenant_sync_enrollments" \
            > /tmp/tenant-sync-enrollment-proof.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/tenant-sync-enrollment-proof.json', 'utf8'));
          const batch = Array.isArray(payload) ? payload : [payload];
          const row = batch.flatMap((entry) => entry?.results || [])[0];
          if (!row) throw new Error('M7D2 enrollment proof returned no result');
          if (Number(row.enrolled_rows) !== 0) throw new Error('M7D2 unexpectedly found enrolled sources');
          console.log(`M7D2 enrollment_rows=${Number(row.enrollment_rows || 0)} enrolled_rows=0`);
          NODE
          npx --yes "wrangler@$WRANGLER_VERSION" queues info catalog-engine-import-scan | tee /tmp/scan-queue.txt
          npx --yes "wrangler@$WRANGLER_VERSION" queues info catalog-engine-import-detail | tee /tmp/detail-queue.txt
          grep -Eq 'Producers:.*worker:catalog-engine([,[:space:]]|$)' /tmp/scan-queue.txt || { echo "Main scan producer missing"; exit 1; }
          grep -Eq 'Producers:.*worker:catalog-engine([,[:space:]]|$)' /tmp/detail-queue.txt || { echo "Main detail producer missing"; exit 1; }

      - name: Smoke test deployed application against existing catalog
        shell: bash
        run: |
          curl --fail --silent --show-error "$PUBLIC_URL/api/health" > /tmp/health.json
          curl --fail --silent --show-error "$PUBLIC_URL/api/catalog/meta" > /tmp/meta.json
          curl --fail --silent --show-error "$PUBLIC_URL/api/leagues" > /tmp/leagues.json
          curl --fail --silent --show-error "$PUBLIC_URL/api/teams?entityType=club" > /tmp/teams.json
          curl --fail --silent --show-error "$PUBLIC_URL/api/facets" > /tmp/facets.json
          curl --fail --silent --show-error "$PUBLIC_URL/api/products?page=1&limit=15" > /tmp/products.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const meta = JSON.parse(fs.readFileSync('/tmp/meta.json', 'utf8'));
          const leagues = JSON.parse(fs.readFileSync('/tmp/leagues.json', 'utf8'));
          const teams = JSON.parse(fs.readFileSync('/tmp/teams.json', 'utf8'));
          const facets = JSON.parse(fs.readFileSync('/tmp/facets.json', 'utf8'));
          const products = JSON.parse(fs.readFileSync('/tmp/products.json', 'utf8'));
          if (!health.ok || !health.catalogApi || !health.professionalTaxonomy) throw new Error('Professional catalog API health check failed.');
          if (!Number(meta.stats?.products) || !meta.navigation?.length) throw new Error('Professional catalog meta is empty.');
          if (!leagues.items?.length) throw new Error('League navigation is empty.');
          if (!teams.items?.length) throw new Error('Team navigation is empty.');
          if (!facets.items?.length) throw new Error('Facet navigation is empty.');
          if (!products.items?.length || products.items.length > 15) throw new Error('Pagination did not return 1-15 products.');
          if (products.total !== meta.stats.products) throw new Error('Catalog totals disagree.');
          const firstId = products.items[0]?.id;
          if (!firstId) throw new Error('First product id is missing.');
          fs.writeFileSync('/tmp/first-product-id.txt', firstId);
          NODE
          FIRST_PRODUCT_ID="$(cat /tmp/first-product-id.txt)"
          curl --fail --silent --show-error "$PUBLIC_URL/api/products/$FIRST_PRODUCT_ID" > /tmp/product.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const detail = JSON.parse(fs.readFileSync('/tmp/product.json', 'utf8'));
          if (!detail.product?.media?.length) throw new Error('Product detail media is empty.');
          NODE

      - name: Publish successful application deploy evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description "App deployed + smoke passed; infrastructure bindings and sync-off boundary verified" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json

      - name: Publish failed application deploy evidence
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state failure --arg context "$STATUS_CONTEXT" \
            --arg description "Application deploy/smoke failed; inspect tenant automation boundaries before retry" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
