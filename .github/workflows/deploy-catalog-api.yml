name: Deploy Catalog Engine application

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-catalog-api.yml"
      - "index.html"
      - "app.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "config/dependency-policy.json"
      - "migrations/**"
      - "scripts/copy-storefront-data.mjs"
      - "scripts/verify-dist.mjs"
      - "src/**"
      - "worker/**"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

# This workflow may apply schema migrations, so it shares the production-D1
# serialization group with catalog publication/sync jobs. It must not rebuild or
# replace catalog business data.
concurrency:
  group: catalog-engine-production-d1
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.123.0
      PUBLIC_URL: https://catalog-engine.lucassantanals0110.workers.dev

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Install project dependencies
        run: npm ci

      - name: Quality gate
        run: npm run quality

      # Build/verify before the first production mutation. A broken frontend or
      # public artifact must fail before migrations/deploy touch production.
      - name: Build and verify application artifact
        run: |
          npm run build
          npm run build:verify

      - name: Apply D1 schema migrations
        run: npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply CATALOG_DB --remote --config wrangler.jsonc

      - name: Deploy Worker and static application assets
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.jsonc

      # The catalog is expected to already exist through its own publication/sync
      # path. This smoke verifies compatibility but never generates/replaces data.
      - name: Smoke test deployed application against existing catalog
        shell: bash
        run: |
          curl --fail --silent --show-error "$PUBLIC_URL/api/health" > /tmp/health.json
          curl --fail --silent --show-error "$PUBLIC_URL/api/catalog/meta" > /tmp/meta.json
          curl --fail --silent --show-error "$PUBLIC_URL/api/leagues" > /tmp/leagues.json
          curl --fail --silent --show-error "$PUBLIC_URL/api/teams?entityType=club" > /tmp/teams.json
          curl --fail --silent --show-error "$PUBLIC_URL/api/facets" > /tmp/facets.json
          curl --fail --silent --show-error "$PUBLIC_URL/api/products?page=1&limit=15" > /tmp/products.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const meta = JSON.parse(fs.readFileSync('/tmp/meta.json', 'utf8'));
          const leagues = JSON.parse(fs.readFileSync('/tmp/leagues.json', 'utf8'));
          const teams = JSON.parse(fs.readFileSync('/tmp/teams.json', 'utf8'));
          const facets = JSON.parse(fs.readFileSync('/tmp/facets.json', 'utf8'));
          const products = JSON.parse(fs.readFileSync('/tmp/products.json', 'utf8'));
          if (!health.ok || !health.catalogApi || !health.professionalTaxonomy) throw new Error('Professional catalog API health check failed.');
          if (!Number(meta.stats?.products) || !meta.navigation?.length) throw new Error('Professional catalog meta is empty.');
          if (!leagues.items?.length) throw new Error('League navigation is empty.');
          if (!teams.items?.length) throw new Error('Team navigation is empty.');
          if (!facets.items?.length) throw new Error('Facet navigation is empty.');
          if (!products.items?.length || products.items.length > 15) throw new Error('Pagination did not return 1-15 products.');
          if (products.total !== meta.stats.products) throw new Error('Catalog totals disagree.');
          const firstId = products.items[0]?.id;
          if (!firstId) throw new Error('First product id is missing.');
          fs.writeFileSync('/tmp/first-product-id.txt', firstId);
          NODE
          FIRST_PRODUCT_ID="$(cat /tmp/first-product-id.txt)"
          curl --fail --silent --show-error "$PUBLIC_URL/api/products/$FIRST_PRODUCT_ID" > /tmp/product.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const detail = JSON.parse(fs.readFileSync('/tmp/product.json', 'utf8'));
          if (!detail.product?.media?.length) throw new Error('Product detail media is empty.');
          NODE
