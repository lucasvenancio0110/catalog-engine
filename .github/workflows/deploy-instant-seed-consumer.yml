name: Deploy IC2 instant seed consumer

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/deploy-instant-seed-consumer.yml'
      - 'wrangler.instant-seed.jsonc'
      - 'worker/instant-seed-*.js'
      - 'worker/ingestion/providers/**'
      - 'worker/ingestion/yupoo-preview-seed.js'
      - 'src/catalog-provider/provider-contract.js'
      - 'tests/instant-seed-*.test.mjs'
      - 'tests/instant-catalog-provider-seed.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: catalog-engine-instant-seed-infra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.123.0
      STATUS_CONTEXT: catalog-engine/ic2-instant-seed-infra

    steps:
      - name: Checkout exact trusted-main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Secret-free contract gate
        run: |
          npx vitest run tests/instant-seed-queue.test.mjs tests/instant-catalog-provider-seed.test.mjs
          npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run --config wrangler.instant-seed.jsonc --outdir /tmp/catalog-engine-instant-seed

      - name: Ensure bounded Queue resources exist
        shell: bash
        run: |
          set -euo pipefail
          for queue in catalog-engine-instant-seed catalog-engine-instant-seed-dlq; do
            if ! npx --yes "wrangler@$WRANGLER_VERSION" queues info "$queue" >/dev/null 2>&1; then
              npx --yes "wrangler@$WRANGLER_VERSION" queues create "$queue"
            fi
          done

      - name: Deploy private instant seed consumer
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.instant-seed.jsonc

      - name: Verify Queue and consumer attachment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@$WRANGLER_VERSION" queues info catalog-engine-instant-seed | tee /tmp/instant-seed-queue.txt
          npx --yes "wrangler@$WRANGLER_VERSION" queues info catalog-engine-instant-seed-dlq | tee /tmp/instant-seed-dlq.txt
          npx --yes "wrangler@$WRANGLER_VERSION" queues consumer worker list catalog-engine-instant-seed --json > /tmp/instant-seed-consumers.json
          grep -Fq 'catalog-engine-instant-seed' /tmp/instant-seed-consumers.json || { echo "Instant seed consumer not attached"; exit 1; }

      - name: Publish successful instant seed infrastructure evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description "IC2 instant seed Queue + private consumer deployed and verified" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json

      - name: Publish failed instant seed infrastructure evidence
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state failure --arg context "$STATUS_CONTEXT" \
            --arg description "IC2 instant seed infrastructure deploy failed" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
