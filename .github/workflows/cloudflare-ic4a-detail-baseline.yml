name: IC4A detail throughput baseline

# IC4A is closed with trusted production evidence in
# docs/IC4A-CLOSURE-2026-09-07.md. This workflow now preserves the historical
# measurement contract in secret-free PR validation only. It intentionally no
# longer runs as a production topology gate once IC4B changes the live Queue.
on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-ic4a-detail-baseline.yml'
      - 'scripts/cloudflare-ic4a-detail-baseline.mjs'
      - 'tests/ic4a-detail-baseline.test.mjs'
      - 'worker/ingestion/ic4a-detail-baseline-contract.js'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Verify closed IC4A measurement contract
        run: npx vitest run tests/ic4a-detail-baseline.test.mjs

      - name: Secret-free quality gate
        run: npm run quality
