name: M7D7 fleet canary v6 to v7 apply

on:
  push:
    branches:
      - m7d7/promotion-authority-primitive-v1

permissions:
  contents: write

concurrency:
  group: m7d7-fleet-canary-v7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[m7d7-fleet-canary-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m7d7/promotion-authority-primitive-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply fleet canary v6 to v7
        run: node scripts/m7d7-fleet-canary-v7-apply.mjs
      - name: Quality gate
        run: npm run quality
      - name: Commit tested canary changes
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/m7d7-fleet-canary-v7-apply.yml
          rm -f scripts/m7d7-fleet-canary-v7-apply.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'm7d7: prove fleet canary v6 to v7 [m7d7-fleet-canary-applied]'
          git push origin HEAD:m7d7/promotion-authority-primitive-v1
