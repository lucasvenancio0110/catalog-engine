name: Validar Catalog V0.3

on:
  push:
    branches: ["agent/catalog-v03-structure"]
    paths:
      - "scripts/**"
      - "data/store.json"
      - ".github/workflows/validate-v03.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch V0.3
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Executar crawler sem publicar
        env:
          MAX_ALBUMS: "40"
          MAX_PAGES: "3"
        run: node scripts/crawl-yupoo.mjs "https://zhouchangliang.x.yupoo.com/albums/"

      - name: Auditar classificação e white-label
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('data/catalog.json', 'utf8'));
          const source = JSON.parse(fs.readFileSync('data/source-state.json', 'utf8'));
          const images = catalog.products.flatMap((p) => p.images || []);
          const missing = images.filter((image) => !fs.existsSync(image.replace(/^\.\//, '')));
          const leaked = /x\.yupoo\.com|photo\.yupoo\.com/i.test(JSON.stringify(catalog));
          const genericNavigationInProducts = catalog.products.filter((p) => /^(?:FA Premier League|Spain La Liga|Italy Serie A|France Ligue 1|Women Jersey|Retro jersey|player version Jersey|national team Jersey)$/i.test(p.name || ''));

          console.log(JSON.stringify({
            products: catalog.products.length,
            photos: images.length,
            pagesScanned: catalog.crawl?.pagesScanned,
            candidatesScanned: catalog.crawl?.candidatesScanned,
            taxonomyEntries: catalog.taxonomy?.length || 0,
            filteredNavigation: source.navigation?.length || 0,
            filteredInformation: source.information?.length || 0,
            publicSourceLeak: leaked,
            missingImages: missing.length,
            genericNavigationInProducts: genericNavigationInProducts.map((p) => p.name)
          }, null, 2));

          if (!catalog.products.length || !images.length || leaked || missing.length || genericNavigationInProducts.length) {
            process.exit(1);
          }
          NODE
