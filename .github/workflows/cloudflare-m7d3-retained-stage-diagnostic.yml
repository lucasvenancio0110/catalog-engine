name: Diagnose retained M7D3 stage

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-m7d3-retained-stage-diagnostic.yml'
      - 'scripts/cloudflare-m7d3-retained-stage-diagnostic.mjs'
      - 'tests/m7d3-retained-stage-diagnostic.test.mjs'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-m7d3-retained-stage-diagnostic.yml'
      - 'scripts/cloudflare-m7d3-retained-stage-diagnostic.mjs'
      - 'tests/m7d3-retained-stage-diagnostic.test.mjs'

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('m7d3-diagnostic-pr-{0}', github.event.pull_request.number) || 'catalog-engine-production-d1' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret-free quality gate
        run: npm run quality

  diagnose:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      RETAINED_M7D3_TENANT_ID: t_294b6cefe10ef209be1b
      STATUS_CONTEXT: catalog-engine/m7d3-retained-stage-diagnostic
    steps:
      - name: Checkout exact trusted-main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Quality gate before read-only diagnosis
        run: npm run quality
      - name: Inspect retained M7D3 stage without mutation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-m7d3-retained-stage-diagnostic.mjs | tee /tmp/m7d3-retained-stage-diagnostic.json
          cat /tmp/m7d3-retained-stage-diagnostic.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish successful diagnostic evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description "M7D3 retained stage diagnosis completed read-only" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
      - name: Publish failed diagnostic evidence
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state failure --arg context "$STATUS_CONTEXT" \
            --arg description "M7D3 retained stage diagnosis failed" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
