name: Cloudflare IC4E production detail-swarm proof

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-ic4e-detail-swarm.yml'
      - 'scripts/cloudflare-ic4e-detail-swarm.mjs'
      - 'tests/ic4e-detail-swarm-proof.test.mjs'
      - 'worker/ingestion/ic4e-detail-swarm-proof-contract.js'
      - 'worker/tenant-import-dispatcher.js'
      - 'worker/ingestion/context.js'
      - 'worker/ingestion/scan-consumer.js'
      - 'worker/ingestion/detail-consumer.js'
      - 'worker/ingestion/finalize-consumer.js'
      - 'worker/ingestion/provider-detail-governor.js'
      - 'worker/ingestion/tenant-d1-write-governor.js'
      - 'worker/import-scan-entry.js'
      - 'worker/import-detail-entry.js'
      - 'worker/tenant-data-plane-schema-v8.js'
      - 'wrangler.jsonc'
      - 'wrangler.import-scan.jsonc'
      - 'wrangler.import-detail.jsonc'
  workflow_run:
    workflows: ['Deploy Catalog Engine application']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify IC4E proof contract
        run: |
          node --check scripts/cloudflare-ic4e-detail-swarm.mjs
          npx vitest run \
            tests/ic4e-detail-swarm-proof.test.mjs \
            tests/tenant-import-auto-canary.test.mjs \
            tests/ic4b-detail-fanout.test.mjs \
            tests/ic4c-provider-detail-governor.test.mjs \
            tests/ic4d-tenant-d1-write-governor.test.mjs \
            tests/tenant-import-scan.test.mjs \
            tests/tenant-import-detail.test.mjs \
            tests/tenant-import-queue-config.test.mjs \
            tests/exact-sha-production-proof-trigger-alignment.test.mjs

      - name: Secret-free quality gate
        run: npm run quality

  prerequisites:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve exact deployed trusted-main SHA
        id: target
        env:
          EVENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVENT_SHA" || { echo 'Missing target SHA'; exit 1; }
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-SHA application, Queue and IC4 safety chain outside mutation lock
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 360); do
            STATUS_JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPO/commits/$SHA/status")"
            APP_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/application-deploy")][0].state // "missing"')"
            QUEUE_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/queue-consumer-activation")][0].state // "missing"')"
            FLEET_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/tenant-data-plane-fleet-canary")][0].state // "missing"')"
            AUTO_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/tenant-import-auto-canary")][0].state // "missing"')"
            PB9_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/pb9-production-proof")][0].state // "missing"')"
            IC2_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/ic2-production-proof")][0].state // "missing"')"
            IC3_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/ic3-production-proof")][0].state // "missing"')"
            IC4B_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/ic4b-detail-fanout")][0].state // "missing"')"
            IC4C_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/ic4c-provider-governor")][0].state // "missing"')"
            IC4D_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/ic4d-tenant-d1-write-governor")][0].state // "missing"')"
            if [ "$APP_STATE" = success ] && [ "$QUEUE_STATE" = success ] && \
               [ "$FLEET_STATE" = success ] && [ "$AUTO_STATE" = success ] && \
               [ "$PB9_STATE" = success ] && [ "$IC2_STATE" = success ] && \
               [ "$IC3_STATE" = success ] && [ "$IC4B_STATE" = success ] && \
               [ "$IC4C_STATE" = success ] && [ "$IC4D_STATE" = success ]; then
              echo 'exact_sha_application_deploy=success'
              echo 'exact_sha_queue_activation=success'
              echo 'exact_sha_fleet=success'
              echo 'exact_sha_real_provider_import=success'
              echo 'exact_sha_pb9_lkg=success'
              echo 'exact_sha_ic2=success'
              echo 'exact_sha_ic3=success'
              echo 'exact_sha_ic4b=success'
              echo 'exact_sha_ic4c=success'
              echo 'exact_sha_ic4d=success'
              exit 0
            fi
            case "$APP_STATE:$QUEUE_STATE:$FLEET_STATE:$AUTO_STATE:$PB9_STATE:$IC2_STATE:$IC3_STATE:$IC4B_STATE:$IC4C_STATE:$IC4D_STATE" in
              *failure*|*error*)
                echo "Exact-SHA dependency failed: app=$APP_STATE queue=$QUEUE_STATE fleet=$FLEET_STATE auto=$AUTO_STATE pb9=$PB9_STATE ic2=$IC2_STATE ic3=$IC3_STATE ic4b=$IC4B_STATE ic4c=$IC4C_STATE ic4d=$IC4D_STATE"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Exact-SHA dependencies unresolved: app=$APP_STATE queue=$QUEUE_STATE fleet=$FLEET_STATE auto=$AUTO_STATE pb9=$PB9_STATE ic2=$IC2_STATE ic3=$IC3_STATE ic4b=$IC4B_STATE ic4c=$IC4C_STATE ic4d=$IC4D_STATE"
          exit 1

  prove:
    needs: prerequisites
    if: needs.prerequisites.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 130
    concurrency:
      group: catalog-engine-production-d1
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      IC4E_REFERENCE_MERCHANT: CROCCODILOS
      STATUS_CONTEXT: catalog-engine/ic4e-detail-swarm
      TARGET_SHA: ${{ needs.prerequisites.outputs.sha }}

    steps:
      - name: Checkout exact deployed trusted-main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate trusted Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Quality and IC4E contract gate before real large-catalog proof
        run: |
          node --check scripts/cloudflare-ic4e-detail-swarm.mjs
          npx vitest run tests/ic4e-detail-swarm-proof.test.mjs tests/tenant-import-auto-canary.test.mjs tests/ic4b-detail-fanout.test.mjs tests/ic4c-provider-detail-governor.test.mjs tests/ic4d-tenant-d1-write-governor.test.mjs tests/tenant-import-scan.test.mjs tests/tenant-import-detail.test.mjs
          npm run quality

      - name: Prove recurring Intelligent Sync remains disabled
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (String(config.vars?.TENANT_IMPORT_AUTOMATION_ENABLED || '') !== '1') throw new Error('Initial import automation must remain enabled');
          if (String(config.vars?.TENANT_SYNC_AUTOMATION_ENABLED || '') !== '0') throw new Error('Recurring sync must remain disabled');
          if (String(config.vars?.TENANT_SYNC_ACTIVE_COHORT || '') !== '') throw new Error('Recurring sync cohort must remain empty');
          if (String(config.vars?.TENANT_SYNC_MAX_JOBS_PER_TICK || '') !== '1') throw new Error('Recurring sync max jobs changed');
          NODE

      - name: Prove real large-catalog scheduler Queue detail swarm
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-ic4e-detail-swarm.mjs | tee /tmp/ic4e-detail-swarm-safe.json
          jq -e '
            .ic4eProductionDetailSwarmPassed == true and
            .contractVersion == 1 and
            .referenceClass == "real-large-catalog" and
            .realLargeCatalog == true and
            .manualQueueMessagesProduced == false and
            .schedulerDiscovered == true and
            .acceptedDecisionIncludesSchedulerWait == true and
            .materiallyImproved == true and
            .improvementPct >= .minimumMaterialImprovementPct and
            .authoritativeIdentityMatch == true and
            .listingWithoutDetail == 0 and
            .detailWithoutListing == 0 and
            .terminal == .discovered and
            .failed == 0 and
            .terminalExceptions <= .safeExceptionBudget and
            .retryExcess <= .safeExceptionBudget and
            .queueStartClean == true and
            .queueEndClean == true and
            .dlqEndClean == true and
            .referenceLkgUnchanged == true and
            .defaultCatalogUnchanged == true and
            .recurringIntelligentSyncChanged == false and
            .privateIdentifiersExposed == false and
            .temporaryFixtureCleaned == true
          ' /tmp/ic4e-detail-swarm-safe.json >/dev/null
          cat /tmp/ic4e-detail-swarm-safe.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish successful IC4E production proof
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description 'IC4E green; real large-catalog swarm materially improved with identity and Queue/DLQ safety' \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/statuses/$TARGET_SHA" -d @/tmp/status.json

      - name: Publish failed IC4E production proof
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA" || exit 0
          jq -n --arg state failure --arg context "$STATUS_CONTEXT" \
            --arg description 'IC4E large-catalog proof failed; existing IC4D/PB9 safe authority remains in force' \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/statuses/$TARGET_SHA" -d @/tmp/status.json
