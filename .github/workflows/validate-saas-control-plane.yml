name: Validate SaaS control plane

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'src/domain/tenant-*.js'
      - 'worker/admin-*.js'
      - 'worker/control-plane-plan.js'
      - 'worker/runtime-identity.js'
      - 'worker/custom-domain.js'
      - 'worker/cloudflare-saas.js'
      - 'worker/cloudflare-platform.js'
      - 'worker/tenant-data-plane.js'
      - 'worker/data-plane-provider-runner.js'
      - 'worker/domain-provider-runner.js'
      - 'worker/domain-job-scheduler.js'
      - 'worker/tenant-routing.js'
      - 'worker/entry.js'
      - 'worker/index.js'
      - 'tests/tenant-*.test.mjs'
      - 'tests/tenant-routing.test.mjs'
      - 'tests/admin-*.test.mjs'
      - 'tests/custom-domain.test.mjs'
      - 'tests/cloudflare-platform.test.mjs'
      - 'tests/domain-job-scheduler.test.mjs'
      - 'docs/SAAS-ARCHITECTURE.md'
      - 'docs/CUSTOM-DOMAINS.md'
      - 'docs/TENANT-DATA-PLANES.md'
      - 'wrangler.jsonc'
      - 'AGENTS.md'
      - '.github/workflows/validate-saas-control-plane.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run quality

      - name: Apply all D1 migrations to clean SQLite database
        shell: bash
        run: |
          set -euo pipefail
          DB=/tmp/catalog-engine-ci.sqlite
          rm -f "$DB"
          for migration in migrations/*.sql; do
            echo "Applying $migration"
            sqlite3 "$DB" < "$migration"
          done
          sqlite3 "$DB" "PRAGMA foreign_key_check;"
          sqlite3 "$DB" "SELECT tenant_id, store_name, theme_key, setup_status FROM tenant_store_profiles;"
          sqlite3 "$DB" "SELECT tenant_id, data_plane_key, status, schema_version FROM tenant_catalog_instances;"

      - name: Verify durable custom-domain provider state
        shell: bash
        run: |
          set -euo pipefail
          DB=/tmp/catalog-engine-ci.sqlite
          TENANT='t_00000000000000000001'
          DOMAIN='dom_0123456789abcdefabcd'
          sqlite3 "$DB" "INSERT INTO tenant_domains(domain_id,tenant_id,hostname,domain_type,status) VALUES('$DOMAIN','$TENANT','www.example-store.test','custom','pending');"
          sqlite3 "$DB" "INSERT INTO tenant_domain_provider_state(domain_id,tenant_id,provider,provider_status,ssl_status,cname_target) VALUES('$DOMAIN','$TENANT','cloudflare','pending','pending','shops.catalogengine.test');"
          sqlite3 "$DB" "INSERT INTO tenant_domain_jobs(job_id,tenant_id,domain_id,operation,status) VALUES('djob_0123456789abcdefabcd','$TENANT','$DOMAIN','provision','pending');"
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM tenant_domain_provider_state WHERE domain_id='$DOMAIN' AND provider='cloudflare';")" = '1'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM tenant_domain_jobs WHERE domain_id='$DOMAIN' AND operation='provision' AND status='pending';")" = '1'
          sqlite3 "$DB" "PRAGMA foreign_key_check;"

      - name: Verify durable isolated data-plane provider state
        shell: bash
        run: |
          set -euo pipefail
          DB=/tmp/catalog-engine-ci.sqlite
          TENANT='t_00000000000000000001'
          sqlite3 "$DB" "INSERT INTO tenant_data_plane_provider_state(tenant_id,provider,dispatch_namespace,worker_script_name,d1_database_name,worker_status,database_status) VALUES('$TENANT','cloudflare_wfp','catalog-engine-production','ce-default-ci','ce-default-ci','pending','pending');"
          sqlite3 "$DB" "INSERT INTO tenant_data_plane_jobs(job_id,tenant_id,operation,status) VALUES('dpjob_0123456789abcdefabcd','$TENANT','provision','pending');"
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM tenant_data_plane_provider_state WHERE tenant_id='$TENANT' AND provider='cloudflare_wfp';")" = '1'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM tenant_data_plane_jobs WHERE tenant_id='$TENANT' AND operation='provision' AND status='pending';")" = '1'
          sqlite3 "$DB" "PRAGMA foreign_key_check;"
