name: M7D9 documentation closure

on:
  push:
    branches:
      - docs/m7d9-production-closure
    paths:
      - scripts/m7d9-doc-closure.mjs
      - .github/workflows/m7d9-doc-closure.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m7d9-doc-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/m7d9-production-closure
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconcile M7D9 owner documentation
        run: node scripts/m7d9-doc-closure.mjs

      - name: Full quality gate
        run: npm run quality

      - name: Commit permanent documentation only
        shell: bash
        run: |
          git config user.name "catalog-engine-bot"
          git config user.email "catalog-engine-bot@users.noreply.github.com"
          git add \
            START-HERE-AI.md \
            docs/CURRENT-STATE.md \
            docs/DEVELOPMENT-ROADMAP.md \
            docs/TENANT-SYNC.md \
            docs/TENANT-DATA-PLANES.md \
            docs/DEPLOYMENT-PIPELINES.md \
            docs/M7D9-CLOSURE-2026-08-30.md
          if git diff --cached --quiet; then
            echo "Documentation already reconciled."
          else
            git commit -m "docs: close M7D9 production state"
            git pull --rebase origin docs/m7d9-production-closure
            git push origin HEAD:docs/m7d9-production-closure
          fi
