name: Validate final M7D8 implementation shape

on:
  push:
    branches: ['m7d8/verified-promotion-cursor-commit-v1']
    paths:
      - '.github/workflows/m7d8-final-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m7d8/verified-promotion-cursor-commit-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove unused canary import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          script_path = Path('scripts/cloudflare-m7d8-finalization-canary.mjs')
          script = script_path.read_text()
          old = "import { processTenantIncrementalFinalizationJob, runDueTenantIncrementalFinalizations } from '../worker/ingestion/incremental-finalization-runner.js';"
          new = "import { runDueTenantIncrementalFinalizations } from '../worker/ingestion/incremental-finalization-runner.js';"
          if old not in script:
              raise SystemExit('unused canary import anchor missing')
          script_path.write_text(script.replace(old, new, 1))
          PY
      - name: Verify bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "scripts/cloudflare-m7d8-finalization-canary.mjs "
          ! grep -F 'processTenantIncrementalFinalizationJob' scripts/cloudflare-m7d8-finalization-canary.mjs
      - name: Install dependencies
        run: npm ci
      - name: Full quality gate
        run: npm run quality
      - name: Build and verify application artifact
        run: |
          npm run build
          npm run build:verify
      - name: Commit validated canary script
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'catalog-engine-m7d8-bot'
          git config user.email 'catalog-engine-m7d8-bot@users.noreply.github.com'
          git add scripts/cloudflare-m7d8-finalization-canary.mjs
          git commit -m 'm7d8: validate trusted finalization canary'
          git push origin HEAD:m7d8/verified-promotion-cursor-commit-v1
