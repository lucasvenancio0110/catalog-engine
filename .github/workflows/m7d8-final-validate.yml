name: Validate final M7D8 implementation shape

on:
  push:
    branches: ['m7d8/verified-promotion-cursor-commit-v1']
    paths:
      - '.github/workflows/m7d8-final-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m7d8/verified-promotion-cursor-commit-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Finalize implementation wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path('scripts/cloudflare-m7d8-finalization-canary.mjs')
          script = script_path.read_text()
          old = "import { processTenantIncrementalFinalizationJob, runDueTenantIncrementalFinalizations } from '../worker/ingestion/incremental-finalization-runner.js';"
          new = "import { runDueTenantIncrementalFinalizations } from '../worker/ingestion/incremental-finalization-runner.js';"
          if old not in script:
              raise SystemExit('unused canary import anchor missing')
          script_path.write_text(script.replace(old, new, 1))

          deploy_path = Path('.github/workflows/deploy-catalog-api.yml')
          deploy = deploy_path.read_text()
          workflow_anchor = "      - '.github/workflows/cloudflare-incremental-scan-stage-canary.yml'"
          workflow_line = "      - '.github/workflows/cloudflare-m7d8-finalization-canary.yml'"
          if workflow_line not in deploy:
              if workflow_anchor not in deploy:
                  raise SystemExit('deploy workflow anchor missing')
              deploy = deploy.replace(workflow_anchor, workflow_anchor + '\n' + workflow_line, 1)
          script_anchor = "      - 'scripts/cloudflare-incremental-scan-stage-canary.mjs'"
          script_line = "      - 'scripts/cloudflare-m7d8-finalization-canary.mjs'"
          if script_line not in deploy:
              if script_anchor not in deploy:
                  raise SystemExit('deploy script anchor missing')
              deploy = deploy.replace(script_anchor, script_anchor + '\n' + script_line, 1)
          deploy_path.write_text(deploy)
          PY
      - name: Verify bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/deploy-catalog-api.yml scripts/cloudflare-m7d8-finalization-canary.mjs "
          grep -F "'.github/workflows/cloudflare-m7d8-finalization-canary.yml'" .github/workflows/deploy-catalog-api.yml
          grep -F "'scripts/cloudflare-m7d8-finalization-canary.mjs'" .github/workflows/deploy-catalog-api.yml
          ! grep -F 'processTenantIncrementalFinalizationJob' scripts/cloudflare-m7d8-finalization-canary.mjs
      - name: Install dependencies
        run: npm ci
      - name: Full quality gate
        run: npm run quality
      - name: Build and verify application artifact
        run: |
          npm run build
          npm run build:verify
      - name: Commit validated final wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'catalog-engine-m7d8-bot'
          git config user.email 'catalog-engine-m7d8-bot@users.noreply.github.com'
          git add .github/workflows/deploy-catalog-api.yml scripts/cloudflare-m7d8-finalization-canary.mjs
          git commit -m 'm7d8: own trusted finalization production proof'
          git push origin HEAD:m7d8/verified-promotion-cursor-commit-v1
