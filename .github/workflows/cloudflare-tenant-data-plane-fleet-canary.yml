name: Cloudflare tenant data-plane fleet canary

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-tenant-data-plane-fleet-canary.yml'
      - '.github/workflows/deploy-catalog-api.yml'
      - '.github/workflows/activate-tenant-import-queues.yml'
      - 'scripts/cloudflare-tenant-data-plane-fleet-canary.mjs'
      - 'scripts/cloudflare-tenant-data-plane-fleet-prepare.mjs'
      - 'tests/tenant-data-plane-fleet-canary.test.mjs'
      - 'tests/tenant-data-plane-fleet-preparation.test.mjs'
      - 'worker/cloudflare-platform.js'
      - 'worker/data-plane-migration-runner.js'
      - 'worker/ingestion/tenant-data-plane.js'
      - 'worker/tenant-data-plane-command.js'
      - 'worker/tenant-data-plane-schema-v4.js'
      - 'worker/tenant-data-plane-schema-v5.js'
      - 'worker/tenant-data-plane-schema-v6.js'
      - 'worker/tenant-data-plane-schema-v7.js'
      - 'worker/tenant-data-plane-schema-v8.js'
      - 'migrations/0018_tenant_data_plane_fleet_migrations.sql'
      - 'migrations/0019_tenant_data_plane_migration_capability.sql'
      - 'wrangler.jsonc'
  workflow_run:
    workflows: ['Deploy Catalog Engine application']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret-free quality gate
        run: npm run quality

  prerequisites:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve exact deployed trusted-main SHA
        id: target
        env:
          EVENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVENT_SHA" || { echo "Missing target SHA"; exit 1; }
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-SHA application and Queue evidence outside mutation lock
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            STATUS_JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/commits/$SHA/status")"
            APP_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/application-deploy")][0].state // "missing"')"
            QUEUE_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/queue-consumer-activation")][0].state // "missing"')"
            if [ "$APP_STATE" = success ] && [ "$QUEUE_STATE" = success ]; then
              exit 0
            fi
            case "$APP_STATE:$QUEUE_STATE" in
              *failure*|*error*)
                echo "Exact-SHA prerequisite failed: app=$APP_STATE queue=$QUEUE_STATE"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Exact-SHA application/Queue evidence did not arrive"
          exit 1

  canary:
    needs: prerequisites
    if: needs.prerequisites.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: catalog-engine-production-d1
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      STATUS_CONTEXT: catalog-engine/tenant-data-plane-fleet-canary

    steps:
      - name: Checkout exactly the deployed trusted-main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prerequisites.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate before production fleet canary
        run: npm run quality

      - name: Prove recurring sync remains disabled
        shell: bash
        run: |
          set -euo pipefail
          SYNC_AUTOMATION_VALUE="$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(String(c.vars?.TENANT_SYNC_AUTOMATION_ENABLED || ''));" )"
          test "$SYNC_AUTOMATION_VALUE" = "0" || { echo "TENANT_SYNC_AUTOMATION_ENABLED must remain 0 through M7D9"; exit 1; }
          echo "TENANT_SYNC_AUTOMATION_ENABLED=$SYNC_AUTOMATION_VALUE"

      - name: Validate trusted Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }

      - name: Prove scheduler-owned v7 to v8 fleet maintenance and LKG preservation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-tenant-data-plane-fleet-canary.mjs | tee /tmp/fleet-canary.json
          cat /tmp/fleet-canary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish successful fleet canary evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.prerequisites.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description "Cron upgraded isolated v7 tenant to v8; removal schema inert; LKG preserved" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json

      - name: Publish failed fleet canary evidence
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.prerequisites.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state failure --arg context "$STATUS_CONTEXT" \
            --arg description "Schema-v8 fleet maintenance canary failed; inspect retained LKG/removal evidence" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
