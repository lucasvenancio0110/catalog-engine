name: M7D9 canary schema batch hotfix

on:
  push:
    branches: ['m7d9/hotfix-canary-schema-batch']
    paths:
      - '.github/workflows/m7d9-canary-schema-batch-hotfix.yml'
      - 'scripts/m7d9-canary-schema-batch-hotfix.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m7d9/hotfix-canary-schema-batch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded canary hotfix
        run: node scripts/m7d9-canary-schema-batch-hotfix.mjs
      - run: git diff --check
      - name: Focused proof
        run: npx vitest run tests/d1-batch-chunks.test.mjs tests/tenant-m7d9-removal-canary.test.mjs
      - name: Full quality
        run: npm run quality
      - name: Commit validated permanent hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "catalog-engine-m7d9-hotfix-bot"
          git config user.email "catalog-engine-m7d9-hotfix-bot@users.noreply.github.com"
          git add scripts/cloudflare-m7d9-removal-canary.mjs tests/tenant-m7d9-removal-canary.test.mjs
          git diff --cached --quiet && { echo 'No permanent hotfix change'; exit 1; }
          git commit -m "fix: chunk M7D9 canary schema bootstrap"
          git push origin HEAD:m7d9/hotfix-canary-schema-batch
