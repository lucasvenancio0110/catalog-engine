name: Cloudflare automatic tenant import canary

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-auto-tenant-import-canary.yml'
      - '.github/workflows/cloudflare-tenant-data-plane-fleet-canary.yml'
      - '.github/workflows/activate-tenant-import-queues.yml'
      - 'scripts/cloudflare-auto-tenant-import-canary.mjs'
      - 'tests/tenant-import-auto-canary.test.mjs'
      - 'src/catalog-intelligence/**'
      - 'src/domain/catalog-classifier.js'
      - 'worker/ingestion/context.js'
      - 'worker/ingestion/scan-consumer.js'
      - 'worker/import-scan-entry.js'
      - 'worker/tenant-import-dispatcher.js'
      - 'worker/tenant-classification-runner.js'
      - 'worker/tenant-verification-runner.js'
      - 'worker/data-plane-migration-runner.js'
      - 'worker/tenant-data-plane-schema-v4.js'
      - 'worker/tenant-data-plane-schema-v5.js'
      - 'worker/tenant-data-plane-schema-v6.js'
      - 'worker/tenant-data-plane-schema-v7.js'
      - 'worker/tenant-data-plane-schema-v8.js'
      - 'migrations/0018_tenant_data_plane_fleet_migrations.sql'
      - 'migrations/0019_tenant_data_plane_migration_capability.sql'
  workflow_run:
    workflows: ['Deploy Catalog Engine application']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret-free quality gate
        run: npm run quality

  prerequisites:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve exact deployed trusted-main SHA
        id: target
        env:
          EVENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVENT_SHA" || { echo "Missing target SHA"; exit 1; }
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-SHA application, Queue and fleet evidence outside mutation lock
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 300); do
            STATUS_JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/commits/$SHA/status")"
            APP_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/application-deploy")][0].state // "missing"')"
            QUEUE_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/queue-consumer-activation")][0].state // "missing"')"
            FLEET_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[] | select(.context=="catalog-engine/tenant-data-plane-fleet-canary")][0].state // "missing"')"
            if [ "$APP_STATE" = success ] && [ "$QUEUE_STATE" = success ] && [ "$FLEET_STATE" = success ]; then
              exit 0
            fi
            case "$APP_STATE:$QUEUE_STATE:$FLEET_STATE" in
              *failure*|*error*)
                echo "Exact-SHA prerequisite failed: app=$APP_STATE queue=$QUEUE_STATE fleet=$FLEET_STATE"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Exact-SHA application/Queue/fleet evidence did not arrive"
          exit 1

  canary:
    needs: prerequisites
    if: needs.prerequisites.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: catalog-engine-production-d1
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      AUTO_CANARY_MAX_PRODUCTS: '6'
      STATUS_CONTEXT: catalog-engine/tenant-import-auto-canary

    steps:
      - name: Checkout exactly the deployed trusted-main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prerequisites.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate before production canary
        run: npm run quality

      - name: Detect automatic tenant discovery state
        id: automation
        shell: bash
        run: |
          set -euo pipefail
          AUTOMATION_VALUE="$(node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(String(c.vars?.TENANT_IMPORT_AUTOMATION_ENABLED || ''));" )"
          case "$AUTOMATION_VALUE" in
            0)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Invalid tenant import automation setting: $AUTOMATION_VALUE"
              exit 1
              ;;
          esac
          echo "TENANT_IMPORT_AUTOMATION_ENABLED=$AUTOMATION_VALUE"

      - name: Record intentionally disabled automatic canary
        if: steps.automation.outputs.enabled == 'false'
        shell: bash
        run: |
          echo "Automatic tenant import canary skipped because TENANT_IMPORT_AUTOMATION_ENABLED=0." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate trusted Cloudflare credentials
        if: steps.automation.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }

      - name: Prove scheduler-driven isolated import and CEI classify verify with zero manual Queue messages
        if: steps.automation.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-auto-tenant-import-canary.mjs | tee /tmp/auto-import-canary.json
          cat /tmp/auto-import-canary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish successful automatic canary evidence
        if: ${{ success() && steps.automation.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.prerequisites.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description "Cron completed isolated Queue import and CEI classify/verify with zero manual messages" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json

      - name: Publish failed automatic canary evidence
        if: ${{ failure() && steps.automation.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.prerequisites.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state failure --arg context "$STATUS_CONTEXT" \
            --arg description "Automatic tenant import/CEI canary failed; inspect isolated tenant evidence before promotion" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
