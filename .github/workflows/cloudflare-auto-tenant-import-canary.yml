name: Cloudflare automatic tenant import canary

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-auto-tenant-import-canary.yml"
      - "scripts/cloudflare-auto-tenant-import-canary.mjs"
      - "tests/tenant-import-auto-canary.test.mjs"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-auto-tenant-import-canary.yml"
      - "scripts/cloudflare-auto-tenant-import-canary.mjs"
      - "tests/tenant-import-auto-canary.test.mjs"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: catalog-engine-production-d1
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret-free quality gate
        run: npm run quality

  canary:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      AUTO_CANARY_MAX_PRODUCTS: "6"
      STATUS_CONTEXT: catalog-engine/tenant-import-auto-canary

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate trusted Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Quality gate before production canary
        run: npm run quality

      - name: Assert automatic tenant discovery is ON
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"TENANT_IMPORT_AUTOMATION_ENABLED": "1"' wrangler.jsonc

      - name: Prove scheduler-driven isolated tenant import with zero manual Queue messages
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-auto-tenant-import-canary.mjs | tee /tmp/auto-import-canary.json
          cat /tmp/auto-import-canary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish successful automatic canary evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description "Cron discovered canary and completed isolated Queue import with zero manual messages" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json

      - name: Publish failed automatic canary evidence
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state failure --arg context "$STATUS_CONTEXT" \
            --arg description "Automatic scheduler canary failed; inspect Queue/tenant evidence before M5 closure" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
