name: M7D7 schema v7 apply and quality

on:
  push:
    branches:
      - m7d7/promotion-authority-primitive-v1

permissions:
  contents: write

concurrency:
  group: m7d7-schema-v7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[m7d7-schema-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m7d7/promotion-authority-primitive-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply schema v7 foundation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/m7d7-schema-v7-apply.mjs')
          text = path.read_text()
          redundant = '    ["?1,6,\'maintenance\',\'failed\',1,NULL", "?1,7,\'maintenance\',\'failed\',1,NULL"],\n'
          if redundant not in text:
              raise SystemExit('m7d7_redundant_patch_guard_missing')
          path.write_text(text.replace(redundant, ''))
          PY
          node scripts/m7d7-schema-v7-apply.mjs
      - name: Quality gate
        run: npm run quality
      - name: Commit tested non-workflow foundation
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/validate-saas-control-plane.yml
          git checkout -- .github/workflows/validate-tenant-ingestion.yml
          git checkout -- .github/workflows/m7d7-schema-v7-apply.yml
          rm -f scripts/m7d7-schema-v7-apply.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'm7d7: prepare schema v7 authority CAS [m7d7-schema-applied]'
          git push origin HEAD:m7d7/promotion-authority-primitive-v1
