name: M7D7 schema v7 apply and quality

on:
  push:
    branches:
      - m7d7/promotion-authority-primitive-v1

permissions:
  contents: write

concurrency:
  group: m7d7-schema-v7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[m7d7-schema-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m7d7/promotion-authority-primitive-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply schema v7 foundation
        run: node scripts/m7d7-schema-v7-apply.mjs
      - name: Quality gate
        run: npm run quality
      - name: Commit foundation and remove temporary updater
        run: |
          set -euo pipefail
          rm -f scripts/m7d7-schema-v7-apply.mjs
          rm -f .github/workflows/m7d7-schema-v7-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'm7d7: prepare schema v7 authority CAS [m7d7-schema-applied]'
          git push origin HEAD:m7d7/promotion-authority-primitive-v1
