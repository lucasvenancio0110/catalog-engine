name: Diagnose retained automatic import canary

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-retained-canary-diagnostic.yml"
      - "scripts/cloudflare-retained-canary-diagnostic.mjs"
      - "tests/retained-canary-diagnostic.test.mjs"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cloudflare-retained-canary-diagnostic.yml"
      - "scripts/cloudflare-retained-canary-diagnostic.mjs"
      - "tests/retained-canary-diagnostic.test.mjs"
  workflow_dispatch:
    inputs:
      tenant_id:
        description: "Exact opaque retained automatic-import canary tenant ID"
        required: false
        default: "t_877e74005a61fd5ce924"

permissions:
  contents: read
  statuses: write

concurrency:
  group: catalog-engine-production-d1
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret-free quality gate
        run: npm run quality

  diagnose:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      RETAINED_CANARY_TENANT_ID: ${{ inputs.tenant_id || 't_877e74005a61fd5ce924' }}
      STATUS_CONTEXT: catalog-engine/retained-canary-diagnostic
    steps:
      - name: Checkout exact trusted-main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Quality gate before read-only diagnosis
        run: npm run quality
      - name: Inspect retained canary without mutating Cloudflare state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-retained-canary-diagnostic.mjs | tee /tmp/retained-canary-diagnostic.json
          cat /tmp/retained-canary-diagnostic.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish successful retained-canary diagnostic evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$STATUS_CONTEXT" \
            --arg description "Retained automatic-import canary diagnosis completed read-only" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
      - name: Publish failed retained-canary diagnostic evidence
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state failure --arg context "$STATUS_CONTEXT" \
            --arg description "Retained automatic-import canary diagnosis failed" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
