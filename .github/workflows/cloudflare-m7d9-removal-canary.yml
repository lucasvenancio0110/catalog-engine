name: Cloudflare incremental safe-removal canary

on:
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/cloudflare-m7d9-removal-canary.yml'
      - '.github/workflows/cloudflare-tenant-data-plane-fleet-canary.yml'
      - 'scripts/cloudflare-m7d9-removal-canary.mjs'
      - 'scripts/cloudflare-tenant-data-plane-fleet-canary.mjs'
      - 'worker/tenant-data-plane-schema-v8.js'
      - 'worker/ingestion/incremental-removal.js'
      - 'worker/ingestion/incremental-plan.js'
      - 'worker/ingestion/incremental-scan.js'
      - 'worker/ingestion/incremental-stage.js'
      - 'worker/ingestion/incremental-verification-runner.js'
      - 'worker/ingestion/incremental-promotion.js'
      - 'tests/tenant-incremental-removal.test.mjs'
      - 'tests/tenant-m7d9-removal-canary.test.mjs'
  workflow_run:
    workflows: ['Deploy Catalog Engine application']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: catalog-engine-m7d9-safe-removal-canary
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Secret-free quality gate
        run: npm run quality

  canary:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      APPLICATION_STATUS_CONTEXT: catalog-engine/application-deploy
      FLEET_STATUS_CONTEXT: catalog-engine/tenant-data-plane-fleet-canary
      M7D8_STATUS_CONTEXT: catalog-engine/tenant-incremental-finalization-canary
      M7D9_STATUS_CONTEXT: catalog-engine/tenant-incremental-safe-removal-canary

    steps:
      - name: Resolve exact trusted-main SHA
        id: target
        env:
          EVENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EVENT_SHA" || { echo "Missing target SHA"; exit 1; }
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exactly the deployed trusted-main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate before production canary
        run: npm run quality

      - name: Validate trusted Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }

      - name: Wait for exact-SHA deploy, fleet v8 and M7D8 regression evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            STATUS_JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/commits/$SHA/status")"
            APP_STATE="$(printf '%s' "$STATUS_JSON" | jq -r --arg c "$APPLICATION_STATUS_CONTEXT" '[.statuses[] | select(.context==$c)][0].state // "missing"')"
            FLEET_STATE="$(printf '%s' "$STATUS_JSON" | jq -r --arg c "$FLEET_STATUS_CONTEXT" '[.statuses[] | select(.context==$c)][0].state // "missing"')"
            D8_STATE="$(printf '%s' "$STATUS_JSON" | jq -r --arg c "$M7D8_STATUS_CONTEXT" '[.statuses[] | select(.context==$c)][0].state // "missing"')"
            if [ "$APP_STATE" = success ] && [ "$FLEET_STATE" = success ] && [ "$D8_STATE" = success ]; then
              exit 0
            fi
            case "$APP_STATE:$FLEET_STATE:$D8_STATE" in
              *failure*|*error*)
                echo "Exact-SHA prerequisite failed: app=$APP_STATE fleet=$FLEET_STATE m7d8=$D8_STATE"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Exact-SHA application/fleet/M7D8 evidence did not arrive"
          exit 1

      - name: Prove repeated miss, scoped removal and safe restoration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-m7d9-removal-canary.mjs | tee /tmp/m7d9-canary.json
          cat /tmp/m7d9-canary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish successful M7D9 canary evidence
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state success --arg context "$M7D9_STATUS_CONTEXT" \
            --arg description "Repeated complete misses remove once; other scope and merchant override remain safe" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json

      - name: Publish failed M7D9 canary evidence
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state failure --arg context "$M7D9_STATUS_CONTEXT" \
            --arg description "M7D9 repeated-miss/removal proof failed; retain isolated D1 evidence" \
            --arg target_url "$RUN_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" -d @/tmp/status.json
