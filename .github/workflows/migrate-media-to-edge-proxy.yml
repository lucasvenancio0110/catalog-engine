name: Migrate catalog media to Cloudflare edge proxy

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Yupoo catalog source"
        required: true
        default: "https://zhouchangliang.x.yupoo.com/albums/"
        type: string
      max_pages:
        description: "Maximum catalog pages used to remap the current public products"
        required: true
        default: "10"
        type: string
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/migrate-media-to-edge-proxy.yml"
      - "scripts/migrate-remote-media.mjs"
      - "scripts/remote-media-audit.mjs"
      - "scripts/copy-storefront-data.mjs"
      - "scripts/verify-dist.mjs"
      - "migrations/0002_product_media.sql"
      - "migrations/0003_media_variants.sql"

permissions:
  contents: write

concurrency:
  group: catalog-media-edge-proxy
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_URL: ${{ inputs.source_url || 'https://zhouchangliang.x.yupoo.com/albums/' }}
      MAX_PAGES: ${{ inputs.max_pages || '10' }}
      WRANGLER_VERSION: 4.123.0
      PUBLIC_URL: https://catalog-engine.lucassantanals0110.workers.dev

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Install project dependencies
        run: npm ci

      - name: Apply D1 migrations
        run: npx --yes "wrangler@$WRANGLER_VERSION" d1 migrations apply CATALOG_DB --remote --config wrangler.jsonc

      - name: Build private source mapping without downloading images
        env:
          MEDIA_SQL_OUT: /tmp/media-sources.sql
          MEDIA_SUMMARY_OUT: /tmp/media-proxy-summary.json
        run: |
          node scripts/migrate-remote-media.mjs "$SOURCE_URL"
          cat /tmp/media-proxy-summary.json

      - name: Remove repository-hosted supplier media
        run: |
          rm -rf assets/media
          rm -f data/media-manifest.json

      - name: Audit sanitized edge-proxy catalog
        run: node scripts/remote-media-audit.mjs

      - name: Load private media origins into D1
        run: npx --yes "wrangler@$WRANGLER_VERSION" d1 execute CATALOG_DB --remote --config wrangler.jsonc --file=/tmp/media-sources.sql

      - name: Verify D1 media registry
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" d1 execute CATALOG_DB --remote --config wrangler.jsonc --command="SELECT COUNT(*) AS media_sources FROM media_sources; SELECT COUNT(*) AS product_media FROM product_media;"

      - name: Quality gate
        run: npm run quality

      - name: Build sanitized storefront
        run: |
          npm run build
          npm run build:verify

      - name: Deploy Worker and static storefront
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --config wrangler.jsonc

      - name: Smoke test optimized media variants
        shell: bash
        run: |
          curl --fail --silent --show-error "$PUBLIC_URL/api/health"
          node --input-type=module <<'NODE' > /tmp/smoke-media.txt
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('data/catalog.json', 'utf8'));
          const media = catalog.products?.[0]?.media?.[0];
          if (!media?.url || !media?.thumbnailUrl || !media?.downloadUrl) process.exit(1);
          console.log(media.thumbnailUrl);
          console.log(media.url);
          console.log(media.downloadUrl);
          NODE
          while IFS= read -r path; do
            curl --fail --silent --show-error --head "$PUBLIC_URL$path"
          done < /tmp/smoke-media.txt

      - name: Warm visible catalog media cache
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('data/catalog.json', 'utf8'));
          const products = catalog.products || [];
          const thumbs = [...new Set(products.map((product) => product.media?.[0]?.thumbnailUrl).filter(Boolean))].slice(0, 60);
          const views = [...new Set(products.map((product) => product.media?.[0]?.url).filter(Boolean))].slice(0, 12);
          fs.writeFileSync('/tmp/warm-thumbs.txt', thumbs.map((url) => `${process.env.PUBLIC_URL}${url}`).join('\n') + '\n');
          fs.writeFileSync('/tmp/warm-views.txt', views.map((url) => `${process.env.PUBLIC_URL}${url}`).join('\n') + '\n');
          console.log(`Warming ${thumbs.length} thumbnails and ${views.length} display images.`);
          NODE
          xargs -r -n1 -P8 curl --fail --silent --show-error --output /dev/null < /tmp/warm-thumbs.txt
          xargs -r -n1 -P6 curl --fail --silent --show-error --output /dev/null < /tmp/warm-views.txt

      - name: Commit sanitized catalog and remove image binaries
        shell: bash
        run: |
          git config user.name "catalog-engine-bot"
          git config user.email "catalog-engine-bot@users.noreply.github.com"
          git add data/catalog.json
          git add -A assets/media data/media-manifest.json
          if git diff --cached --quiet; then
            echo "Edge-proxy catalog already materialized."
          else
            git commit -m "migrate catalog media to optimized Cloudflare edge proxy"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
