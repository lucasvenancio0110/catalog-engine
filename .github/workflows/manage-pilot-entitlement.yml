name: Manage pilot entitlement

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Grant or revoke first-beta store provisioning'
        required: true
        type: choice
        options:
          - grant
          - revoke
      principal_id:
        description: 'Opaque authenticated account principal (prn_...)'
        required: true
        type: string
      expires_at:
        description: 'Grant expiry in ISO-8601 UTC (required for grant, ignored for revoke)'
        required: false
        type: string
      reason:
        description: 'Auditable reason (5-160 chars)'
        required: true
        type: string
      confirmation:
        description: 'Type PILOT to authorize the production entitlement mutation'
        required: true
        type: string

permissions:
  contents: read

jobs:
  mutate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: catalog-engine-production-d1
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PLATFORM_DISPATCH_NAMESPACE: catalog-engine-production
      PILOT_ENTITLEMENT_ACTION: ${{ inputs.action }}
      PILOT_PRINCIPAL_ID: ${{ inputs.principal_id }}
      PILOT_EXPIRES_AT: ${{ inputs.expires_at }}
      PILOT_REASON: ${{ inputs.reason }}
    steps:
      - name: Require explicit production confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PILOT" || {
            echo 'Confirmation must be exactly PILOT.'
            exit 1
          }

      - name: Checkout exact trusted-main revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply audited entitlement mutation
        run: node scripts/manage-pilot-entitlement.mjs
